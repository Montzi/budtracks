name: Deploy Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
concurrency:
  group: worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_TITLE: budtracks-kv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install pinned deps and run the offline test suite before touching Cloudflare.
      - run: npm install --no-audit --no-fund
      - run: npm test

      # Create the KV namespace only if one with this title does not exist yet; export its id.
      - name: Ensure KV namespace
        run: |
          id=$(npx wrangler kv namespace list | jq -r --arg t "$KV_TITLE" '.[] | select(.title==$t) | .id' | head -n1)
          if [ -z "$id" ]; then
            npx wrangler kv namespace create "$KV_TITLE" >/dev/null
            id=$(npx wrangler kv namespace list | jq -r --arg t "$KV_TITLE" '.[] | select(.title==$t) | .id' | head -n1)
          fi
          [ -n "$id" ] || { echo "KV namespace id not found"; exit 1; }
          echo "KV_ID=$id" >> "$GITHUB_ENV"

      # Fill the placeholders in wrangler.toml (CI-only copy; never committed).
      - name: Generate wrangler.toml
        env:
          PLAID_ENV_VAR: ${{ vars.PLAID_ENV }}
        run: |
          env_name="${PLAID_ENV_VAR:-sandbox}"
          case "$env_name" in sandbox|production) ;; *) echo "PLAID_ENV must be sandbox or production"; exit 1;; esac
          sed -i "s|REPLACE_WITH_KV_NAMESPACE_ID|$KV_ID|; s|^PLAID_ENV = \"sandbox\"|PLAID_ENV = \"$env_name\"|" wrangler.toml
          if [ "$env_name" = "production" ]; then
            sed -i 's|^# PLAID_REDIRECT_URI = |PLAID_REDIRECT_URI = |' wrangler.toml
          fi

      - name: Deploy
        run: npx wrangler deploy

      # Set ENC_KEY once. Never rotated automatically: rotating would orphan stored tokens.
      # Piped via stdin so the value never appears in logs or args.
      - name: Ensure ENC_KEY secret
        run: |
          if npx wrangler secret list | jq -e '.[] | select(.name=="ENC_KEY")' >/dev/null; then
            echo "ENC_KEY already set"
          else
            openssl rand -base64 32 | npx wrangler secret put ENC_KEY >/dev/null
            echo "ENC_KEY created"
          fi

      # Plaid keys are (re)set on every deploy so rotating the GitHub secret takes effect.
      # Piped via stdin so the values never appear in logs or args.
      - name: Set Plaid secrets
        env:
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
        run: |
          [ -n "$PLAID_CLIENT_ID" ] && [ -n "$PLAID_SECRET" ] || { echo "PLAID_CLIENT_ID and PLAID_SECRET repo secrets are required"; exit 1; }
          printf '%s' "$PLAID_CLIENT_ID" | npx wrangler secret put PLAID_CLIENT_ID >/dev/null
          printf '%s' "$PLAID_SECRET" | npx wrangler secret put PLAID_SECRET >/dev/null
          echo "Plaid secrets set"
