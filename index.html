    if (!bank) { $('#ferr').textContent = 'Enter the bank or app name.'; return; }
    if (last4 && !/^\d{4}$/.test(last4)) { $('#ferr').textContent = 'Last 4 must be 4 digits.'; return; }
    editVia(viaLabel(state.payVia[+f.dataset.i]), { bank, last4, type: f.elements.type.value }); closeSheet(); commit('Payment method updated'); return;
  }
  if (e.target.id === 'viaadd') {
    const bank = e.target.elements.bank.value.trim().slice(0, 30), last4 = e.target.elements.last4.value.trim();
    if (bank && (!last4 || /^\d{4}$/.test(last4))) { addVia({ bank, last4, type: '' }); commit('Added ' + bank); } else toast('Enter a bank and 4 digits');
  }
  if (e.target.classList.contains('cat-add')) {
    const list = e.target.dataset.list, v = e.target.elements.nc.value.trim().slice(0, 30);
    if (v && !state[list].includes(v)) { state[list].push(v); const par = e.target.elements.par.value; if (par && par !== v) state.catParents[v] = par; commit('Added ' + v); }
  }
  if (e.target.id === 'svform') { saveSavings(e.target); return; }
  if (e.target.id === 'svbank') { state.savings.bank = e.target.elements.bank.value.trim().slice(0, 30); commit('Bank name saved'); accountSheet(true); return; }
  if (e.target.id === 'acctform') { saveAccount(e.target); return; }
  if (e.target.id === 'catform') { const v = e.target.elements.newcat.value.trim(); if (v) setCategory(e.target.dataset.id, v.slice(0, 30)); }
});

/* ---------- Logo: cursive T with arms, coin head behind a laptop ---------- */
function buildMarks() {
  document.querySelectorAll('.wm').forEach(m => {
    if (!m.offsetWidth) return;
    m.querySelectorAll('svg.arms').forEach(s => s.remove());
    const f = parseFloat(getComputedStyle(m).fontSize), s = m.querySelector('.stem'), hd = m.querySelector('.hd');
    const top = f * 1.42, gap = f * .17, W = m.offsetWidth + gap * 2, drop = f * .62, sw = f * .1;
    const cx = s.offsetLeft + s.offsetWidth / 2 + gap, base = s.offsetTop + s.offsetHeight - top, ext = f * .24;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'arms'); svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('viewBox', `0 0 ${W} ${base + ext + sw}`);
    Object.assign(svg.style, { left: -gap + 'px', top: top + 'px', width: W + 'px', height: (base + ext + sw) + 'px' });
    const k = f / 40;
    svg.innerHTML = `<path d="M${9 * k} ${drop} C${1 * k} ${drop - 3 * k} ${-2 * k} ${13 * k} ${5 * k} ${7 * k} C ${W * .28} ${-3 * k}, ${W * .62} ${15 * k}, ${W - 9 * k} ${4 * k} C ${W + 2 * k} 0, ${W + 1 * k} ${15 * k}, ${W - 5 * k} ${drop}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/><path d="M${cx} ${6 * k} V${base + ext}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/>`;
    m.appendChild(svg);
    hd.style.left = (s.offsetLeft + s.offsetWidth / 2) + 'px'; hd.style.top = (top - f * 1.46) + 'px';
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildMarks);
// Rotation: iOS fires several resizes while it animates. Mark the page as rotating, then redraw the
// logo arms once after the size stops changing instead of on every intermediate size.
let lastW = innerWidth, rotT = null;
function onResize() {
  if (Math.abs(innerWidth - lastW) > 40) document.documentElement.classList.add('rotating');
  lastW = innerWidth;
  clearTimeout(rotT);
  rotT = setTimeout(() => { buildMarks(); requestAnimationFrame(() => document.documentElement.classList.remove('rotating')); }, 220);
}
window.addEventListener('resize', onResize);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'payamt') { e.preventDefault(); const b = document.querySelector('[data-action="pay-set"]'); if (b) b.click(); } });
window.addEventListener('orientationchange', () => { document.documentElement.classList.add('rotating'); onResize(); });

/* ---------- Bud's speech bubble ---------- */
const BUD_LINES = ['Working on it', 'Updating…', 'On it!', 'Consider it done.', "Let's go!", 'Got it.', 'Saved!', 'Done and done.', 'Nice move.', 'Tracking it.'];
let budTimer = null, budHover = false, lastLine = '';
function budHead() {
  const vis = [...document.querySelectorAll('.wm svg.hd')].filter(h => { const r = h.getBoundingClientRect(); return r.width && r.bottom > 0 && r.top < innerHeight; });
  return vis[0] || null;
}
function budSay(text, ms) {
  const b = $('#bud'), h = budHead();
  if (!h) {
    // Logo scrolled away: Bud pops up in the corner with a mini head.
    b.innerHTML = headSVG(hat(), 'mini') + '<span class="bt">' + esc(text) + '</span>';
    b.className = 'bud float on'; b.style.left = b.style.top = b.style.maxWidth = '';
    clearTimeout(budTimer); if (ms) budTimer = setTimeout(() => b.classList.remove('on'), ms); return;
  }
  b.className = 'bud'; b.innerHTML = '<i class="pf p1"></i><i class="pf p2"></i><i class="pf p3"></i><i class="dot d1"></i><i class="dot d2"></i><span class="bt">' + esc(text) + '</span>';
  const r = h.getBoundingClientRect(), w = Math.min(230, innerWidth - 24);
  b.style.maxWidth = w + 'px';
  const right = r.right + 10 + b.offsetWidth < innerWidth - 8;
  b.classList.toggle('left', !right);
  b.style.left = (right ? r.right + 4 : Math.max(8, r.left - 12 - b.offsetWidth)) + 'px';
  b.style.top = Math.max(14, r.top - 4) + 'px';
  b.classList.add('on');
  clearTimeout(budTimer);
  if (ms) budTimer = setTimeout(() => { if (!budHover) b.classList.remove('on'); }, ms);
}
function budReact() {
  let l; do { l = BUD_LINES[Math.floor(Math.random() * BUD_LINES.length)]; } while (l === lastLine);
  lastLine = l; budSay(l, 1800);
}
document.addEventListener('mouseover', e => {
  const h = e.target.closest && e.target.closest('.wm svg.hd');
  if (h && !budHover) { budHover = true; budSay('Hi, my name is Bud. Ready to track?'); }
});
document.addEventListener('mouseout', e => {
  const h = e.target.closest && e.target.closest('.wm svg.hd');
  if (h && !(e.relatedTarget && h.contains(e.relatedTarget))) { budHover = false; clearTimeout(budTimer); budTimer = setTimeout(() => $('#bud').classList.remove('on'), 250); }
});
window.addEventListener('scroll', () => { if (!budHover) $('#bud').classList.remove('on'); }, { passive: true });

/* ---------- Render ---------- */
function viewPlansTab() {
  const v = state.settings.plansView === 'cards' ? 'cards' : 'plans';
  return `<div class="stack"><div class="seg plans-seg" role="group" aria-label="Plans view"><button data-action="plans-view" data-v="plans" aria-pressed="${v === 'plans'}">Pay later</button><button data-action="plans-view" data-v="cards" aria-pressed="${v === 'cards'}">Credit cards</button></div>${v === 'cards' ? viewCards() : viewPlans()}</div>`;
}
const TABS = { overview: viewOverview, transactions: viewTransactions, bills: viewBills, plans: viewPlansTab, income: viewIncome };
function currentTab() { const h = location.hash.slice(1); return h === 'cards' ? 'plans' : TABS[h] ? h : 'overview'; }
function render() {
  LIKELY = null;
  if (location.hash === '#cards') { state.settings.plansView = 'cards'; try { history.replaceState(null, '', '#plans'); localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  const tab = currentTab();
  document.querySelectorAll('#viewSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.settings.view));
  $('#viewSeg').hidden = tab !== 'overview';
  $('#brandOut').hidden = tab === 'overview';
  document.querySelectorAll('.tabs a').forEach(a => { if (a.getAttribute('href') === '#' + tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#main').innerHTML = TABS[tab]();
  if (tab === 'income') bankCardLoad();
  if (Date.now() < partyUntil) document.querySelectorAll('.hero').forEach(h => h.classList.add('party'));
  $('#logoOut').innerHTML = logo();
  buildMarks();
  initCatScroll();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
const bankBoot = () => { bankOAuthResume(); bankAutoSync(); };
connect().then(bankBoot, bankBoot);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') bankAutoSync(); });
})();

</script>
