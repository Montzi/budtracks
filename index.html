<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BudTracks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: one column on phones, overview splits into ledger + charts on wide screens.
   Bold moment: the navy "cycle card" with a serif figure. Everything else stays quiet. */
:root {
  --bg: #eceef2; --surface: #ffffff; --surface-2: #f5f6f9; --line: #e0e3e9; --line-2: #c9ced8;
  --ink: #111726; --ink-2: #454f62; --ink-3: #6f7789;
  --hero: #15203a; --hero-2: #22305180; --hero-ink: #f5f1e7; --hero-ink-2: #b7bdcb; --hero-line: #2c3a5a;
  --brass: #9a6d22; --brass-hi: #d8b26a;
  --accent: #1d3a72; --accent-ink: #ffffff; --accent-soft: #e5ebf6;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s9: #0e8fa3; --s10: #a0527c; --s11: #6b7280; --s12: #8bb12a;
  --display: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --body: 'Geist', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 16px; --shadow: 0 1px 2px #1117260d, 0 8px 24px -12px #1117261f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0f15; --surface: #151a23; --surface-2: #1b212c; --line: #252c39; --line-2: #343d4d;
    --ink: #eef0f4; --ink-2: #b5bbc7; --ink-3: #8a91a0;
    --hero: #18243f; --hero-line: #2d3c5e; --brass: #d8b26a; --brass-hi: #e6c88d;
    --accent: #8fb0ee; --accent-ink: #0c1424; --accent-soft: #1d2840;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s9: #2aa8bd; --s10: #c36a9a; --s11: #8b93a1; --s12: #9cc83a;
    --shadow: 0 1px 2px #0006, 0 8px 24px -12px #0009;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0f15; --surface: #151a23; --surface-2: #1b212c; --line: #252c39; --line-2: #343d4d;
  --ink: #eef0f4; --ink-2: #b5bbc7; --ink-3: #8a91a0;
  --hero: #18243f; --hero-line: #2d3c5e; --brass: #d8b26a; --brass-hi: #e6c88d;
  --accent: #8fb0ee; --accent-ink: #0c1424; --accent-soft: #1d2840;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s9: #2aa8bd; --s10: #c36a9a; --s11: #8b93a1; --s12: #9cc83a;
  --shadow: 0 1px 2px #0006, 0 8px 24px -12px #0009;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num, .amt, td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.app { max-width: 1080px; margin: 0 auto; padding: 14px 16px 104px; display: grid; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.mark { font-family: var(--display); font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
.mark i { color: var(--brass); font-style: italic; }
.sync { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.sync[data-s="ok"]::before { background: var(--good); }
.sync[data-s="busy"]::before { background: var(--warn); }
.sync[data-s="err"]::before { background: var(--crit); }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.grid-2 { display: grid; gap: 16px; }
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) { .grid-2 { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } }
.stack { display: grid; gap: 16px; }

/* Cycle card */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 18px 18px 16px; position: relative; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--hero-line); }
.hero::before { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: linear-gradient(90deg, transparent, var(--brass-hi), transparent); opacity: .8; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero-top .lbl { text-align: center; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-hi); font-weight: 600; }
.range { font-size: 14px; color: var(--hero-ink-2); margin-top: 2px; }
.navbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--hero-line); background: transparent; color: var(--hero-ink); display: grid; place-items: center; }
.navbtn:hover { background: #ffffff10; }
.hero-num { text-align: center; margin: 14px 0 4px; }
.hero-num .big { font-family: var(--display); font-size: clamp(52px, 13vw, 72px); line-height: .95; letter-spacing: -0.02em; display: block; }
.hero-num .big small { font-size: .5em; vertical-align: .62em; margin-right: 2px; color: var(--hero-ink-2); }
.hero-num .cap { font-size: 13px; color: var(--hero-ink-2); }
.meter { height: 6px; border-radius: 99px; background: #ffffff1a; margin: 14px 2px 12px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--brass-hi); }
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.hero-stats div { min-width: 0; }
.hero-stats dt { font-size: 11px; color: var(--hero-ink-2); }
.hero-stats dd { margin: 2px 0 0; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-stats .neg { color: #ff9d9d; }

.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hero-line); font-size: 13px; color: var(--hero-ink-2); }
.hero-foot b { color: var(--hero-ink); font-family: var(--mono); font-weight: 500; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brass-hi); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.cta { display: block; width: 100%; margin-top: 12px; text-align: left; background: #ffffff0f; border: 1px dashed var(--brass-hi); color: var(--hero-ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
.card-h h2 { font-size: 15px; font-weight: 600; }
.card-h .meta { font-size: 12.5px; color: var(--ink-3); }
.card-h .r { display: flex; align-items: center; gap: 8px; }
.card-b { padding: 0 16px 16px; }
.muted { color: var(--ink-3); }

.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.danger.arm { background: var(--crit); color: #fff; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; border-radius: 8px; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; padding: 0; }

/* Ledger rows */
.rows { list-style: none; margin: 0; padding: 0 8px 8px; }
.row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row.is-next { background: color-mix(in srgb, var(--brass-hi) 14%, transparent); border-top-color: transparent; }
.row.is-next + .row { border-top-color: transparent; }
.row.is-paid .nm, .row.is-paid .amt { color: var(--ink-3); }
.row.is-paid .amt { text-decoration: line-through; text-decoration-color: var(--line-2); }
.row.tap { cursor: pointer; }
.row.tap:hover { background: var(--surface-2); }
.check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-2); background: transparent; display: grid; place-items: center; padding: 0; color: transparent; }
.check[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.check svg { width: 14px; height: 14px; }
.date { width: 40px; text-align: center; line-height: 1.05; }
.date .dow { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.date .dd { display: block; font-family: var(--display); font-size: 24px; }
.daybadge { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.main { min-width: 0; }
.nm { font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere; }
.sub { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.amt { font-size: 14px; text-align: right; white-space: nowrap; }
.pill { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--ink); color: var(--bg); }
.pill.brass { background: var(--brass); color: #fff; }
.pill.soft { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.warn::before { content: "! "; color: var(--warn); }
.empty { padding: 18px 16px 22px; color: var(--ink-3); font-size: 14px; display: grid; gap: 10px; justify-items: start; }

/* Totals strip */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--display); font-size: 28px; line-height: 1.1; margin-top: 2px; }
.tile .v small { font-family: var(--body); font-size: 12px; color: var(--ink-3); margin-left: 4px; }

/* Charts */
.donut-wrap { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 420px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } }
.donut-wrap svg { width: 170px; height: 170px; display: block; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; }
.legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 40px; align-items: center; gap: 8px; font-size: 13px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend .lv { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.legend .lp { font-family: var(--mono); color: var(--ink-3); text-align: right; font-size: 12px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--ink-3); }
.chart .lbl-strong { fill: var(--ink); font-weight: 500; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-2); stroke-width: 1; }
.chart-key { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); padding: 0 16px 12px; flex-wrap: wrap; }
.chart-key span { display: inline-flex; align-items: center; gap: 6px; }
.chart-key .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.chart-key .ln { width: 16px; height: 0; border-top: 2px dashed var(--brass); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .tr { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbar .fl { height: 100%; background: var(--c, var(--s1)); border-radius: 99px; }
.hbar .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.hbar .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Plans */
.prov { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.plan { padding: 14px 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); cursor: pointer; }
.plan:first-of-type { border-top: 0; }
.plan:hover { background: var(--surface-2); }
.plan-h { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.plan-h .nm { font-size: 15px; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); }
button.tag:hover { border-color: var(--accent); color: var(--accent); }
.tag.prov-tag { font-weight: 600; letter-spacing: .02em; }
.pips { display: flex; gap: 4px; }
.pips i { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
.pips i.on { background: var(--ink); }
.pips i.nx { background: var(--brass-hi); }
.plan-f { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.plan-f b { font-weight: 500; color: var(--ink); }
details.done summary { padding: 12px 16px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); list-style: none; }
details.done summary::-webkit-details-marker { display: none; }
details.done summary::before { content: "+ "; font-family: var(--mono); }
details.done[open] summary::before { content: "− "; }

/* Utilization */
.util { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.util i { display: block; height: 100%; background: var(--c); border-radius: 99px; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabs-in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 560px; }
.tabs a { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--ink-3); text-decoration: none; font-size: 11px; font-weight: 500; }
.tabs a svg { width: 22px; height: 22px; }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; justify-items: center; }
.sheet-wrap[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: #0a0e1873; }
.sheet { position: relative; width: 100%; max-width: 520px; max-height: 92%; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -12px 40px #0004; animation: up .22s ease-out; }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet h3 { font-family: var(--display); font-size: 28px; font-weight: 400; line-height: 1.1; }
.sheet .lede { color: var(--ink-3); font-size: 13.5px; margin: 4px 0 14px; }
.sheet-h { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fld { display: grid; gap: 5px; grid-column: span 2; min-width: 0; }
.fld.half { grid-column: span 1; }
.fld > span { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.fld em { font-style: normal; color: var(--ink-3); font-weight: 400; }
.fld input, .fld select { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 16px; }
.fld input:focus, .fld select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.money-in { position: relative; }
.money-in i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-3); }
.money-in input { padding-left: 24px; }
.fld.chk { display: flex; align-items: center; gap: 10px; }
.fld.chk input { width: 20px; height: 20px; }
.fld.chk span { font-weight: 400; color: var(--ink); }
.preview { grid-column: span 2; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.form-err { grid-column: span 2; color: var(--crit); font-size: 13px; min-height: 0; }
.form-err:empty { display: none; }
.actions { grid-column: span 2; display: flex; gap: 8px; justify-content: space-between; margin-top: 4px; }
.actions .r { display: flex; gap: 8px; margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
.chip { border: 1px solid var(--line-2); background: var(--surface-2); padding: 9px 14px; border-radius: 99px; font-size: 14px; }
.chip:hover, .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 16px; }
textarea { width: 100%; min-height: 120px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 10px; font: 12px/1.4 var(--mono); color: var(--ink); }

.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 7px 10px; border-radius: 8px; max-width: 240px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; white-space: pre-line; font-family: var(--mono); }
.tip.on { opacity: 1; transform: none; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 13.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.toast.has-undo { pointer-events: auto; }
.toast-undo { background: none; border: 0; padding: 0 0 0 2px; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.note { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.note b { color: var(--ink); font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.prov .v small { display: block; margin: 2px 0 0; }
.amt-btn { background: none; border: 1px solid transparent; border-bottom: 1px dashed var(--line-2); border-radius: 6px; padding: 3px 6px; margin-right: -6px; }
.amt-btn:hover { background: var(--surface-2); border-color: var(--line-2); }
.amt-btn.edited { color: var(--brass); border-bottom-color: var(--brass); }
.tapzone { cursor: pointer; }
.fld input:disabled { opacity: .5; }

.hero-split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: end; margin: 18px 0 4px; }
.hero-split > div { display: grid; gap: 3px; min-width: 0; }
.hs-r { text-align: right; justify-items: end; padding-left: 14px; border-left: 1px solid var(--hero-line); }

/* BudTracks wordmark: coral, one color. Hero is always navy, so it uses the light coral. */
:root { --logo: #c2532f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --logo: #f2a48a; } }
:root[data-theme="dark"] { --logo: #f2a48a; }
.wm { position: relative; display: inline-flex; align-items: flex-end; font: 400 32px/1 var(--display); letter-spacing: -.01em; padding-top: 1.5em; color: var(--logo); white-space: nowrap; }
.hero .wm { --logo: #f2a48a; font-size: 30px; }
.wm .r { font-style: italic; }
.wm .stem { display: inline-block; width: .1em; height: .68em; margin: 0 0 .1em .1em; visibility: hidden; }
.wm svg.arms { position: absolute; overflow: visible; color: var(--logo); }
.wm svg.hd { position: absolute; width: 1.8em; height: 1.48em; transform: translateX(-50%); }
.hero-brand { align-items: flex-end; }

.wm svg.hd { cursor: pointer; }
.wm svg.hd:focus-visible { outline: 2px solid var(--brass-hi); border-radius: 8px; }
.hat-prev { display: grid; place-items: center; background: #15203a; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.hat-prev .hp { width: 150px; height: 124px; }
.hat-sw { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sw-c { width: 38px; height: 38px; border-radius: 50%; background: var(--c); border: 2px solid var(--line-2); padding: 0; }
.sw-c[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw-custom { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.sw-custom input { width: 38px; height: 38px; border: 0; padding: 0; background: none; border-radius: 50%; }
/* Big logo: wordmark centered at the top of the cycle card, coin man sticks out above it. */
.hero { --wmf: clamp(44px, 15vw, 68px); overflow: visible; margin-top: calc(var(--wmf) * 1.22); }
.hero-brand { justify-content: center; position: relative; padding-bottom: 10px; }
.hero .wm { font-size: var(--wmf); margin-top: calc(var(--wmf) * -1.2 - 18px); }
.hero .hero-brand .sync { position: absolute; right: 0; bottom: -2px; font-size: 11px; }
.hero::before { border-radius: 22px 22px 0 0; }
@media (max-width: 420px) { .hero .hero-brand .sync { position: static; } .hero-brand { flex-direction: column; align-items: center; gap: 6px; } }
.hero-brand { padding-bottom: calc(var(--wmf) * .32); }
@media (max-width: 420px) { .hero-brand { gap: calc(var(--wmf) * .3); padding-bottom: 10px; } }

/* Bud speech bubble: navy cloud with thought dots, same navy as the cycle card */
.bud { position: fixed; z-index: 65; background: #15203a; color: #f5f1e7; border-radius: 26px; padding: 12px 18px; font: 600 13.5px/1.35 var(--body);
  box-shadow: 0 0 0 1.5px #2c3a5a, 0 10px 24px #0006; pointer-events: none; opacity: 0; transform: translateY(6px) scale(.94); transform-origin: left bottom; transition: opacity .15s, transform .15s; }
.bud.on { opacity: 1; transform: none; }
.bud .bt { position: relative; z-index: 1; }
.bud .pf, .bud .dot { position: absolute; background: #15203a; border-radius: 50%; box-shadow: 0 0 0 1.5px #2c3a5a; }
.bud .pf { z-index: -1; }
.bud .p1 { width: 34px; height: 34px; top: -12px; left: 16%; }
.bud .p2 { width: 44px; height: 44px; top: -18px; left: 40%; }
.bud .p3 { width: 30px; height: 30px; top: -10px; left: 70%; }
.bud .pf::after { content: ""; position: absolute; inset: 1.5px; border-radius: 50%; background: #15203a; }
.bud::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #15203a; z-index: 0; }
.bud .d1 { width: 12px; height: 12px; left: -10px; bottom: 6px; }
.bud .d2 { width: 7px; height: 7px; left: -20px; bottom: 0; }
.bud.left { transform-origin: right bottom; }
.bud.left .d1 { left: auto; right: -10px; } .bud.left .d2 { left: auto; right: -20px; }
.bud.float { left: auto; right: 14px; top: auto; bottom: calc(86px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; border-radius: 16px; padding: 6px 12px 6px 6px; }
.bud.float::before { display: none; }
.bud .mini { width: 44px; height: 36px; flex: none; }
.bud .mini { background: #15203a; border-radius: 10px; padding: 2px; }
@media (max-width: 600px) { .bud.float { bottom: calc(140px + env(safe-area-inset-bottom)); } }

/* Overview grid: row 1 = cycle card + donut (same height), row 2 = bills + 6-cycle chart. */
.ov { --wmf: clamp(44px, 15vw, 68px); display: grid; gap: 16px; grid-template-columns: 1fr; }
.ov > .hero { order: 1; } .ov > .ov-bills { order: 2; } .ov > .ov-donut { order: 3; } .ov > .ov-bars { order: 4; }
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) {
  .ov { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: stretch; }
  .ov > * { order: 0 !important; }
  .ov > .ov-donut { margin-top: calc(var(--wmf) * 1.22); display: flex; flex-direction: column; }
  .ov > .ov-bills, .ov > .ov-bars { align-self: start; }
  .ov-donut .card-b { flex: 1; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
  .ov-donut .donut-wrap svg { width: 150px; height: 150px; }
  .ov-donut .cat-legend { margin-top: 0; gap: 6px; }
  .ov-donut .cat-legend li { font-size: 12.5px; }
}
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) {
  .ov-donut .card-b { grid-template-columns: minmax(180px, .9fr) minmax(0, 1.25fr); gap: 22px; }
  .ov-donut .donut-wrap svg { width: 100%; height: auto; max-width: 230px; }
  .ov-donut .cat-legend li { grid-template-columns: auto minmax(0, 1fr) auto 30px; font-size: 12.5px; }
  .ov-donut .cat-legend .lc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; min-width: 0; }
  .ov-donut .cat-legend .lv { font-size: 12px; }
}

/* Top glow behind Bud: drifts through colors, rainbow burst after a change */
@property --gh { syntax: '<number>'; inherits: false; initial-value: 40; }
.hero::before { --gh: 40; height: 2px; background: linear-gradient(90deg, transparent, hsl(var(--gh) 75% 65%), transparent); opacity: .9; animation: glowDrift 14s linear infinite; }
@keyframes glowDrift { to { --gh: 400; } }
/* Rainbow layer fades in and out and dissolves toward the edges */
.hero::after { content: ""; position: absolute; top: 0; left: 6%; right: 6%; height: 3px; pointer-events: none;
  background: linear-gradient(90deg, #ff4d4d, #ffa64d, #ffe14d, #4dff88, #4dc3ff, #8f6bff, #ff4dc4, #ff4d4d); background-size: 200% 100%;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  filter: drop-shadow(0 0 5px #ffffff55); opacity: 0; transition: opacity 1.6s ease; animation: rainbow .9s linear infinite; }
.hero.party::after { opacity: 1; }
.hero::before { -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
@keyframes rainbow { to { background-position: 200% 0; } }
.hero-foot { align-items: center; }
.hero-foot .sync { margin-left: auto; color: var(--hero-ink-2); font-size: 11.5px; }
@media (prefers-reduced-motion: reduce) { .hero::before, .hero::after { animation: none; } }
/* Keep the glow lines behind Bud and the laptop */
.hero::before, .hero::after { z-index: 0; }
.wm svg.hd { z-index: 2; }

/* Maker's stamp under the logo */
.hero .byline { position: absolute; right: 0; bottom: 10px; font: italic 400 13px/1 var(--display); letter-spacing: .02em; color: var(--hero-ink-2); opacity: .55; }
.hero .byline::before { content: ""; display: inline-block; width: 18px; height: 1px; background: currentColor; vertical-align: middle; margin-right: 7px; opacity: .7; }
@media (max-width: 420px) { .hero .byline { position: static; } }
/* Stamp: smaller, no dash, engraved 3D letters */
.hero .byline { font-size: 11px; opacity: .8; color: #c9cfdc; letter-spacing: .04em;
  text-shadow: 0 1px 0 #0b1222, 0 2px 0 #0a101e, 0 2px 3px #0008, 0 -1px 0 #ffffff22; }
.hero .byline::before { display: none; }

.subhead.done-h { margin-top: 6px; }
.done-rows .row { opacity: .78; }
.all-done { padding: 14px 8px; }

.done-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.done-sort { font: 500 11.5px var(--body); letter-spacing: 0; text-transform: none; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 4px 6px; }

.alloc-plus { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; font-size: 13.5px; color: var(--ink-2); }
.plus-round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; padding: 0; box-shadow: var(--shadow); }
.plus-round svg { width: 18px; height: 18px; }
.plus-round:hover { filter: brightness(1.08); }
.alloc-row { position: relative; }
.alloc-row .row-x { position: absolute; right: 0; top: 8px; width: 26px; height: 26px; z-index: 1; }
.alloc-row .row-x + .fld { padding-right: 0; }
.alloc-actions { flex-wrap: wrap; }

.plan-sum{border:1px solid var(--line,rgba(127,127,127,.25));border-radius:14px;padding:12px 14px;margin:0 0 14px}

.hero-stats .ss-sub{display:block;font-size:11px;opacity:.7;margin-top:2px;white-space:nowrap}

.sv-chip { display: inline-block; margin-top: 4px; font-size: 11px; font-family: var(--mono); color: var(--brass-hi); border: 1px solid var(--hero-line); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
.sv-box { margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 12px; }

.sv-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sv-k { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.sv-bal { font-family: var(--display); font-size: 28px; font-weight: 500; }
.sv-bank { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.sv-tx { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sv-tx li { display: grid; grid-template-columns: 56px 1fr auto 28px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }

.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.sub .tag { max-width: 100%; }
.tag.via { white-space: normal; overflow-wrap: anywhere; border-radius: 10px; line-height: 1.35; }
.icon-pick.sm { width: 24px; height: 24px; border-radius: 6px; display: inline-grid; vertical-align: middle; margin-right: 6px; flex: none; }
.icon-pick.sm .cico { width: 14px; height: 14px; }
h3 > .icon-pick { display: inline-grid; vertical-align: middle; width: 38px; height: 38px; }
.cat-legend li { grid-template-columns: auto auto minmax(0, 1fr) auto 36px; }
.cat-legend .li { grid-column: 3 / -1; }
.cat-legend .icon-pick.sm { margin: 0; }
.cat-scroll-wrap { margin: 12px 0 4px; }
.cs-hint { margin: 0 0 6px; text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.cat-scroll { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px 0; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.cat-scroll::-webkit-scrollbar { display: none; }

.cs-chip { flex: none; scroll-snap-align: center; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; opacity: .55; transition: opacity .15s, transform .15s, border-color .15s; cursor: pointer; }
.cs-chip .cico { width: 15px; height: 15px; }
.cs-chip b { font-family: var(--mono); font-weight: 500; font-size: 12.5px; }
.cs-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.cs-chip[aria-selected="true"] { opacity: 1; border-color: var(--c); transform: scale(1.06); }
.donut-wrap svg .slice { transition: opacity .15s, transform .15s; transform-origin: 85px 85px; cursor: pointer; }
.donut-wrap svg.has-sel .slice { opacity: .25; }
.donut-wrap svg.has-sel .slice.sel { opacity: 1; transform: scale(1.06); }
.cat-legend li.sel { background: var(--surface-2); border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { .cs-chip, .donut-wrap svg .slice { transition: none; } }
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) {
  .ov-donut .cat-scroll-wrap { grid-column: 1 / -1; order: -1; margin: 0; }
  .ov-donut .cat-legend li { grid-template-columns: auto auto minmax(0, 1fr) auto 30px; }
  .ov-donut .cat-legend .li { grid-column: 3 / -1; }
}
.cat-scroll { position: relative; }
.cs-top { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 26px; margin-bottom: 6px; }
.cs-top .cs-hint { margin: 0; }
.cs-all { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 14px; padding: 3px 12px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
.cs-all[hidden] { display: none; }
.cs-allchip .cs-n { font-weight: 600; }
.donut-wrap svg .slice-ico { transition: opacity .15s; }
.donut-wrap svg.has-sel .slice-ico { opacity: 0; }
.paused-h { margin-top: 10px; }
.paused-row { opacity: .75; }
.paused-row .btn.sm { margin-left: 8px; flex: none; }

/* Bank import */
.bank-in { display: grid; gap: 10px; }
.bank-in > label.btn { justify-self: start; cursor: pointer; }
.bm-list { display: grid; gap: 10px; margin-bottom: 12px; }
.bm { border: 1px solid var(--line-2); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background: var(--surface); min-width: 0; }
.bm.ok { border-color: color-mix(in srgb, var(--good, #3fa56b) 55%, var(--line-2)); }
.bm.dim { opacity: .55; }
.bm-t { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); }
.bm-d { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; min-width: 0; }
.bm-d b { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.bm-d span { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.bm-m { font-size: 13px; color: var(--ink-2); }
.bm-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.bm .seg { justify-self: start; flex-wrap: wrap; }

/* Bank sync: connections card + review inbox */
.bk { display: grid; gap: 12px; }
.bk-form { display: grid; gap: 10px; }
.bk-form .fld { grid-column: auto; }
.bk-err { color: var(--crit); font-size: 13px; margin: 0; overflow-wrap: anywhere; }
.bk-err:empty, .bk-ok:empty { display: none; }
.bk-ok { color: var(--ink-2); font-size: 13px; margin: 0; }
.bk-enr { border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.bk-eh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.bk-eh b { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.bk-sp { flex: 1; }
.bk-acc { list-style: none; margin: 0; padding: 0; }
.bk-acc li { display: flex; align-items: center; gap: 10px; padding: 8px 0; min-width: 0; }
.bk-acc li + li { border-top: 1px solid var(--line); }
.bk-acc .main { flex: 1; min-width: 0; }
.bk-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.tgl { position: relative; display: inline-block; width: 44px; height: 26px; flex: none; }
.tgl input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.tgl span { position: absolute; inset: 0; border-radius: 99px; background: var(--line-2); transition: background .15s; }
.tgl span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0004; transition: transform .15s; }
.tgl input:checked + span { background: var(--accent); }
.tgl input:checked + span::after { transform: translateX(18px); }
.tgl input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.bx-top { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0 0 12px; flex-wrap: wrap; }
.bx { gap: 6px; }
.bx .bm-d span.in { color: var(--good); font-weight: 500; }
.bx-g { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; min-width: 0; }
.bx-g .g-t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.bx-g .cico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.pill.conf-high { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--good) 50%, var(--line-2)); }
.pill.conf-medium { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line-2)); }
.pill.conf-low { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); }
.bx-a { display: flex; gap: 6px; flex-wrap: wrap; }
.bx-ch { border-top: 1px dashed var(--line-2); padding-top: 8px; display: grid; gap: 6px; }
.bx-ch .chips { margin: 0; gap: 6px; }
.bx-ch .chip { padding: 7px 11px; font-size: 13px; text-align: left; }
.bx-ch .h { font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.bx-rec { list-style: none; margin: 0 0 12px; padding: 0; }
.bx-rec li { display: flex; align-items: center; gap: 10px; padding: 8px 0; min-width: 0; }
.bx-rec li + li { border-top: 1px solid var(--line); }
.bx-rec .main { flex: 1; min-width: 0; }
.bx-rec .nm { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.bx-rec .amt { font-size: 13px; white-space: nowrap; }
.bk-auto { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }
.bk-auto input { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); max-width: 100%; }
.bx-sh { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 4px 0 4px; }

/* Installed app: page runs edge to edge, so keep content clear of the notch, status bar and home bar. */
.app { padding-top: max(14px, env(safe-area-inset-top)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.tabs { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
/* While the phone rotates: freeze transitions so nothing animates between the two layouts,
   and hide the fixed tab bar so it does not flash mid-screen. It fades back once the size settles. */
.tabs { transition: opacity .18s ease; }
html.rotating *, html.rotating *::before, html.rotating *::after { transition: none !important; scroll-behavior: auto !important; }
html.rotating .tabs, html.rotating .bud { opacity: 0 !important; }
/* Paycheck prompt inside the navy cycle card */
.pay-ask { margin-top: 12px; padding: 12px; border: 1px dashed var(--brass-hi); border-radius: 12px; background: #ffffff0f; display: grid; gap: 10px; font-size: 13px; color: var(--hero-ink-2); }
.pay-ask label b { display: block; color: var(--hero-ink); font-size: 14px; margin-bottom: 2px; }
.pay-row { display: flex; gap: 8px; }
.pay-row .money-in { flex: 1; min-width: 0; }
.pay-row input { width: 100%; min-width: 0; padding: 10px 12px 10px 24px; border-radius: 10px; border: 1px solid var(--hero-line); background: #0000004d; color: var(--hero-ink); font: 16px var(--mono); }
.pay-row input:focus { outline: 2px solid var(--brass-hi); outline-offset: 0; }
.pay-ask .money-in i { color: var(--hero-ink-2); }
.pay-opts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.pay-same { background: none; border: 1px solid var(--brass-hi); color: var(--brass-hi); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 500; }
.pay-same:hover { background: #ffffff10; }
.bx-split { color: var(--ink-2); font-size: 12px; opacity: .85; overflow-wrap: anywhere; }
.hero-split { margin: 6px 0 0; font-size: 12px; font-family: var(--mono); color: var(--hero-ink-2); text-align: center; overflow-wrap: anywhere; }
.bal-total { display: grid; gap: 2px; margin: 6px 0 8px; }
.bal-total b { font-family: var(--display); font-size: 38px; line-height: 1; letter-spacing: -0.02em; }
.bal-total span { font-size: 13px; color: var(--ink-2); }
.bal-acc { list-style: none; margin: 0 0 10px; padding: 0; }
.bal-acc li { display: flex; align-items: center; gap: 10px; padding: 8px 0; min-width: 0; }
.bal-acc li + li { border-top: 1px solid var(--line); }
.bal-acc .main { flex: 1; min-width: 0; }
.bal-acc .nm { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.bal-acc .sub { font-size: 13px; color: var(--ink-2); }
.bal-acc .mask { color: var(--ink-2); font-weight: 400; }
.pay-edit { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
/* iPhone Duo and notched phones: the camera can sit on a side edge, with different insets on each side.
   Keep sheets, toasts and floating bubbles inside the safe area. */
.sheet-wrap { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
.sheet { max-height: calc(100% - 12px); }
.toast { max-width: calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
.bud.float { right: calc(14px + env(safe-area-inset-right)); }
.fld input[type="date"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; text-align: left; min-height: 44px; }
/* Landscape: cycle card a little narrower, chart card wider so legend names fit. */
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) {
  .ov { grid-template-columns: minmax(0, .86fr) minmax(0, 1.14fr); }
  .ov > .ov-donut { container-type: inline-size; container-name: donut; }
}
/* Chart card too narrow for donut and legend side by side: donut on top, legend full width below. */
@container donut (max-width: 520px) {
  .ov-donut .card-b { grid-template-columns: minmax(0, 1fr); gap: 12px; justify-items: stretch; }
  .ov-donut .donut-wrap { justify-items: center; }
  .ov-donut .donut-wrap svg { width: 100%; max-width: 170px; }
}

/* Plans segmented control, Transactions tab, Latest paycheck */
.plans-seg { justify-self: start; }
.tabs a { min-width: 0; white-space: nowrap; letter-spacing: -.01em; }
.tx-filters { padding: 0 12px 6px; display: grid; gap: 10px; }
.tx-chips { margin: 0; gap: 6px; }
.tx-chips .chip { padding: 6px 11px; font-size: 13px; }
.tx-find { display: flex; gap: 8px; min-width: 0; }
.tx-find input, .tx-find select { min-width: 0; flex: 1 1 0; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
.tx-find select { flex: 0 1 45%; }
.tx-list { padding: 0 0 8px; }
.tx-day { position: sticky; top: 0; z-index: 2; padding: 6px 16px; font-size: 12px; font-weight: 600; letter-spacing: .03em; color: var(--ink-3); background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tx { border-bottom: 1px solid var(--line); min-width: 0; }
.tx-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; width: 100%; padding: 10px 16px; border: 0; background: transparent; color: inherit; text-align: left; min-width: 0; }
.tx-l { display: grid; gap: 2px; min-width: 0; }
.tx-l b { font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.tx-s { font-size: 12.5px; color: var(--ink-3); }
.tx-r { display: grid; justify-items: end; gap: 4px; flex: none; max-width: 52%; }
.tx-r .amt { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
.tx-r .amt.in, .pc-part .amt.in { color: var(--good); font-weight: 500; }
.txc { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); text-align: right; overflow-wrap: anywhere; line-height: 1.3; }
.txc.k-review, .txc.k-earlier { background: color-mix(in srgb, var(--warn) 20%, var(--surface)); color: var(--ink); border-color: color-mix(in srgb, var(--warn) 55%, var(--line-2)); }
.txc.k-spend, .txc.k-income, .txc.k-match { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--ink); border-color: color-mix(in srgb, var(--good) 45%, var(--line-2)); }
.tx.open { background: var(--surface-2); }
.tx-p { padding: 0 16px 12px; display: grid; gap: 8px; }
.tx-p .h { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.tx-p .chips { margin: 0; gap: 6px; }
.tx-p .chip { padding: 7px 11px; font-size: 13px; text-align: left; }
.tx-more { padding: 12px 16px 4px; display: flex; justify-content: center; }
.tx-card .bx-top { margin: 0; }
/* Match picker + Likely completed */
.sheet:has(.pk) { display: flex; flex-direction: column; height: calc(100% - 12px); overflow: hidden; padding-bottom: 0; }
.sheet:has(.pk) #sheetBody { flex: 1; min-height: 0; display: flex; flex-direction: column; }

<script>
/* BudTrack core: pure date + budget logic. No DOM. */
const BT = (() => {
  const DAY = 86400000;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();
  const addMonths = (s, n) => {
    const d = parse(s), day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1, 12);
    t.setDate(Math.min(day, dim(t.getFullYear(), t.getMonth())));
    return iso(t);
  };
  const inR = (d, r) => d >= r.start && d < r.end;
  const round2 = n => Math.round(n * 100) / 100;

  const paycheck = st => st.income.find(i => i.freq === 'biweekly' || i.freq === 'weekly');
  const anchor = st => { const p = paycheck(st); return (p && p.date) || st.settings.anchor || '2026-11-19'; };

  function periodRange(st, view, offset, today) {
    if (view === 'monthly') {
      const t = parse(today);
      const s = new Date(t.getFullYear(), t.getMonth() + offset, 1, 12);
      const e = new Date(s.getFullYear(), s.getMonth() + 1, 1, 12);
      return { start: iso(s), end: iso(e), view };
    }
    const len = view === 'weekly' ? 7 : 14;
    const k = Math.floor(diffDays(anchor(st), today) / len) + offset;
    const start = addDays(anchor(st), k * len);
    return { start, end: addDays(start, len), view };
  }

  // Same day each month, clamped to month length (day 30 in Feb -> 28/29).
  function monthlyDates(day, r) {
    const out = [], s = parse(r.start), e = parse(addDays(r.end, -1));
    let y = s.getFullYear(), m = s.getMonth();
    while (y < e.getFullYear() || (y === e.getFullYear() && m <= e.getMonth())) {
      const d = iso(new Date(y, m, Math.min(day, dim(y, m)), 12));
      if (inR(d, r)) out.push(d);
      if (++m > 11) { m = 0; y++; }
    }
    return out;
  }
  function stepDates(base, step, r) {
    const out = [];
    let k = Math.ceil(diffDays(base, r.start) / step);
    for (let i = 0; i < 400; i++, k++) {
      const d = addDays(base, k * step);
      if (d >= r.end) break;
      if (d >= r.start) out.push(d);
    }
    return out;
  }

  // Pay plans (Klarna / Afterpay / PayPal)
  const planDate = (p, k) => p.dates && p.dates[p.paid + k - 1] ? p.dates[p.paid + k - 1]
    : p.freq === 'monthly' ? addMonths(p.lastDate, k)
    : addDays(p.lastDate, k * (p.freq === 'biweekly' ? 14 : 7));
  const planAmt = (p, n) => p.amounts && p.amounts[n - 1] != null ? p.amounts[n - 1] : p.amount;
  function planSchedule(st, p, today) {
    const out = [];
    for (let k = 1; k <= p.total - p.paid; k++) {
      const date = planDate(p, k), n = p.paid + k;
      const key = 'p:' + p.id + ':' + n;
      const auto = p.autopay !== false && date < today;
      out.push({ n, date, key, amount: planAmt(p, n), paid: key in st.marks ? !!st.marks[key] : auto, auto });
    }
    return out;
  }
  function planStatus(st, p, today) {
    const sched = planSchedule(st, p, today);
    const paidCount = p.paid + sched.filter(x => x.paid).length;
    const unpaid = sched.filter(x => !x.paid);
    return {
      purchased: p.purchased || planDate(p, 1 - p.paid), sched, paidCount, next: unpaid[0] || null, completed: paidCount >= p.total,
      left: p.total - paidCount, ends: sched.length ? sched[sched.length - 1].date : (p.dates ? p.dates[p.total - 1] : p.lastDate),
      owed: round2(unpaid.reduce((a, x) => a + x.amount, 0)),
      total: round2(Array.from({ length: p.total }, (_, i) => planAmt(p, i + 1)).reduce((a, b) => a + b, 0))
    };
  }

  const GROUPS = ['Fixed', 'Apple Subscriptions', 'Subscriptions', 'Other bills', 'Per paycheck', 'Pay plans', 'Credit cards', 'Spending'];

  // Per-paycheck items are budgets (envelopes): no due date, never paid by a tick. What counts toward one is the real
  // spending (state.spends) of its category inside its 14-day cycle. Each spend counts toward at most one budget
  // (the first one listed wins) and is flagged `budgeted`, so totals use max(budget, spent) once and never add the spend again.
  function applyBudgets(st, all, buds) {
    const order = id => st.perPeriod.findIndex(p => p.id === id);
    buds.slice().sort((a, b) => order(a.ref) - order(b.ref) || (a.natural < b.natural ? -1 : 1)).forEach(b => {
      const budget = typeof b.amount === 'number' && b.amount > 0 ? b.amount : 0, on = !b.off && budget > 0 && !!b.category, end = addDays(b.natural, 14);
      b.paid = false; b.auto = false; b.budget = budget; b.on = on; b.spends = []; b.spent = 0; b.winEnd = end;
      if (!on) { b.amount = 0; return; }
      all.forEach(e => { if (e.kind === 'extra' && !e.budgeted && e.paid && e.category === b.category && e.date >= b.natural && e.date < end) { e.budgeted = b.key; b.spends.push(e); } });
      b.spent = round2(b.spends.reduce((a, e) => a + e.amount, 0));
      b.amount = Math.max(budget, b.spent);
    });
  }
  // How much of an item is paid for the money totals: budgets count what was spent, everything else all or nothing.
  const paidOf = x => x.kind === 'spend' ? (x.spent || 0) : x.paid ? x.amount : 0;

  // Items are generated over a wide window, then placed by their effective date:
  // date paid if paid, else the (possibly moved) due date. Moving a date into
  // another pay cycle moves the amount into that cycle's totals.
  function occurrences(st, r, today, raw) {
    let out = [];
    const W = { start: addDays(r.start, -100), end: addDays(r.end, 100), view: r.view };
    for (const b of st.bills) {
      if (b.active === false) continue;
      for (const date of monthlyDates(b.day, W)) {
        const key = 'b:' + b.id + ':' + date;
        out.push({ key, kind: 'bill', ref: b.id, name: b.name, note: b.note || '', category: b.category || '', via: b.via || '', amount: b.amount, date, group: b.group, paid: !!st.marks[key] });
      }
    }
    for (const c of st.cards) {
      if (!c.minPayment) continue;
      for (const date of monthlyDates(c.day, W)) {
        const key = 'c:' + c.id + ':' + date;
        out.push({ key, kind: 'card', ref: c.id, name: c.name, note: 'Minimum payment', category: c.category || 'Credit cards', via: c.via || '', amount: c.minPayment, date, group: 'Credit cards', paid: !!st.marks[key] });
      }
    }
    for (const p of st.plans) {
      for (const s of planSchedule(st, p, today)) {
        out.push({ key: s.key, kind: 'plan', ref: p.id, name: p.merchant, note: p.provider + ' · ' + s.n + ' of ' + p.total, category: p.category || 'Uncategorized', via: p.via || '', amount: s.amount, date: s.date, group: 'Pay plans', paid: s.paid, auto: s.auto, provider: p.provider });
      }
    }
    // Unscheduled spending: already spent unless unticked.
    for (const s of (st.spends || [])) {
      const key = 'x:' + s.id;
      out.push({ key, kind: 'extra', ref: s.id, from: s.from || '', via: s.via || '', name: s.desc || s.category, note: s.category + (s.note ? ' · ' + s.note : ''), category: s.category, amount: s.amount, date: s.date, group: 'Spending', paid: key in st.marks ? !!st.marks[key] : true, auto: true });
    }
    // Unallocated spending: money that left the account with no record yet.
    for (const u of (st.unalloc || [])) {
      const left = unallocLeft(st, u);
      if (left <= 0.004) continue;
      out.push({ key: 'u:' + u.id, kind: 'unalloc', ref: u.id, name: 'Unallocated spending', note: 'Found ' + u.date, category: 'Unallocated', amount: left, date: u.date, group: 'Spending', paid: true, auto: true, pinned: true });
    }
    // Per-paycheck spending: one of each per 14-day cycle.
    for (const date of stepDates(anchor(st), 14, W)) {
      for (const s of st.perPeriod) {

  const tapAttrs = x => x.kind === 'extra' ? `data-action="edit" data-type="extra" data-id="${x.ref}"` : !x.paid && likelyMap().has(x.key) ? `data-action="likely-open" data-key="${esc(x.key)}"` : `data-action="occ" data-key="${esc(x.key)}"`;
  const rowDated = x => {
    const late = !x.paid && x.date < TODAY, d = BT.parse(x.date), isNext = x.key === nextKey;
    const sub = x.kind === 'extra' ? `<span class="tag cat">${catIcon(x.category)}${esc(x.category)}</span>${x.via ? ' <span class="tag via">via ' + esc(viaText(x.via)) + '</span>' : ''}`
      : `${SUB_GROUPS.includes(x.group) && !x.category ? catIcon('Subscriptions') + '<span class="bcat">Subscriptions</span>' + (x.group === 'Apple Subscriptions' ? ' · Apple' : '') + (x.note ? ' · ' + esc(x.note) : '') : (x.category ? catIcon(x.category) + '<span class="bcat">' + esc(x.category) + '</span> · ' : '<span class="dot" style="--c:' + gc(x.group) + '"></span>') + esc(x.note || x.group)}${x.via ? ' <span class="tag via">via ' + esc(viaText(x.via)) + '</span>' : ''}${x.edited ? ' · usually ' + fmt(x.base) : ''}`;
    return `<li class="row${x.paid ? ' is-paid' : ''}${isNext ? ' is-next' : ''}">${check(x)}
      <div class="date" aria-hidden="true"><span class="dow">${DOW[d.getDay()]}</span><span class="dd">${d.getDate()}</span></div>
      <div class="main tapzone" ${tapAttrs(x)}><div class="nm">${esc(x.name)}${isNext ? ' <span class="pill brass">Up next</span>' : ''}${late ? ' <span class="pill soft warn">Past due</span>' : ''}${x.paid ? '' : likelyPill(x.key)}</div>
      <div class="sub">${sub}<span class="sr">${md(x.date)}</span></div>${x.memo ? `<div class="nlabel">${esc(x.memo)}</div>` : ''}${x.paid ? '' : likelyDetail(x.key)}</div>${amtBtn(x)}</li>`;
  };
  const rowLiving = x => { const d = BT.parse(shown(x)); return `<li class="row${x.paid ? ' is-paid' : ''}">${check(x)}
      <div class="date" aria-hidden="true"><span class="dow">${DOW[d.getDay()]}</span><span class="dd">${d.getDate()}</span></div>
      <div class="main tapzone" ${tapAttrs(x)}><div class="nm">${esc(x.name)}${x.paid ? '' : likelyPill(x.key)}</div><div class="sub">${x.category ? catIcon(x.category) + '<span class="bcat">' + esc(x.category) + '</span> · ' : '<span class="dot" style="--c:' + gc(x.group) + '"></span>'}Living expense${x.via ? ' <span class="tag via">via ' + esc(viaText(x.via)) + '</span>' : ''}${x.edited ? ' · usually ' + fmt(x.base) : ''}</div>${x.memo ? `<div class="nlabel">${esc(x.memo)}</div>` : ''}${x.paid ? '' : likelyDetail(x.key)}</div>${amtBtn(x)}</li>`; };
  const rowUnalloc = x => `<li class="row unalloc" data-action="allocate" data-id="${x.ref}" tabindex="0" role="button" aria-label="Sort out ${fmt(x.amount)} unallocated spending">
      <span class="ua-ico" aria-hidden="true">?</span><div class="date" aria-hidden="true"><span class="dow">Found</span><span class="dd">${BT.parse(x.date).getDate()}</span></div>
      <div class="main"><div class="nm">Unallocated spending</div><div class="sub">Tap to record where it went</div></div><div class="amt">${fmt(x.amount)}</div></li>`;
  // Upcoming (unpaid) first by date, then completed below by date. Unallocated stays pinned on top.
  const one = x => x.kind === 'unalloc' ? rowUnalloc(x) : x.kind === 'spend' ? rowLiving(x) : rowDated(x);
  const pinned = dated.filter(x => x.pinned), open = dated.filter(x => !x.pinned && !x.paid);
  const ds = state.settings.doneSort || 'recent', pd = x => x.paidOn || shown(x);
  const SORTS = { recent: (a, b) => pd(b).localeCompare(pd(a)), oldest: (a, b) => pd(a).localeCompare(pd(b)), high: (a, b) => b.amount - a.amount, low: (a, b) => a.amount - b.amount,
    name: (a, b) => a.name.localeCompare(b.name), cat: (a, b) => chartCat(a).localeCompare(chartCat(b)) || pd(b).localeCompare(pd(a)) };
  const done = dated.filter(x => !x.pinned && x.paid).sort(SORTS[ds] || SORTS.recent);
  const rows = dated.length ? `<ul class="rows">${pinned.map(one).join('')}${open.map(one).join('') || (pinned.length ? '' : '<li class="empty all-done">All paid for this ' + VIEWNAME[view] + '.</li>')}</ul>`
    + (done.length ? `<div class="subhead done-h"><span>Completed · ${done.length} · ${fmt(done.reduce((a, x) => a + x.amount, 0))}</span><label class="sr" for="donesort">Sort completed</label><select id="donesort" class="done-sort">${[['recent', 'Most recent'], ['oldest', 'Oldest first'], ['high', 'Amount: high to low'], ['low', 'Amount: low to high'], ['name', 'Name A to Z'], ['cat', 'Category']].map(([v, l]) => `<option value="${v}"${v === ds ? ' selected' : ''}>${l}</option>`).join('')}</select></div><ul class="rows done-rows">${done.map(one).join('')}</ul>` : '')
    : '<div class="empty">Nothing due in this period.</div>';
  const rowsAll = rows + pausedHTML(r) + budgetsHTML(budgets);
  OCC = new Map(s.items.map(x => [x.key, x]));

  const groups = byCategory(s.items, s.needed);

  return `<div class="ov">
  <section class="hero" aria-label="Pay cycle summary">
    <div class="hero-brand">${logo()}</div>
    <div class="hero-top">
      <button class="navbtn" data-action="prev" aria-label="Previous ${VIEWNAME[view]}">${ICON.prev}</button>
      <div class="lbl"><div class="eyebrow">${label}</div><div class="range">${rangeLabel(r)}</div></div>
      <button class="navbtn" data-action="next" aria-label="Next ${VIEWNAME[view]}">${ICON.next}</button>
    </div>
    <div class="lad-tools${hide ? ' hid' : ''}">${hide ? `<span class="lt-msg">Balances hidden<i aria-hidden="true"> · </i><button type="button" class="linkbtn" data-action="hide-bal">Show</button></span>` : ''}<button type="button" class="icon-btn eye" data-action="hide-bal" aria-pressed="${hide}" aria-label="${hide ? 'Show balances' : 'Hide balances'}">${hide ? ICON.eyeoff : ICON.eye}</button></div>
    ${hide ? '' : `<div class="ladder">
      <div class="lad l1"><span class="hs-k">Left in paycheck</span>
        ${s.income > 0 ? `<span class="v${remain < 0 ? ' neg' : ''}">${big(remain)}</span><span class="hs-s">${dep && isAsk(dep.ref) ? `<button class="pay-edit" data-action="pay-edit" data-date="${dep.date}">of ${fmt(s.income)}</button>` : 'of ' + fmt(s.income)}${dep ? '<br>' + lng(dep.date) : ''}${dparts.length > 1 ? ` · <button class="pay-edit" data-action="pay-split" aria-expanded="${HEROUI.split}">split</button>` : ''}</span>` : `<span class="v dim">${big(0)}</span><span class="hs-s">Paycheck not set</span>`}</div>
      <div class="lad l2"><span class="hs-k">${{ weekly: 'Week', biweekly: 'Cycle', monthly: 'Month' }[view]} needs</span><span class="v">${big(s.needed)}</span><span class="hs-s">${Math.round(pct)}% paid</span></div>
      <button class="lad l3" data-action="account"><span class="hs-k">In account</span>${bt !== null ? `<span class="v${bt < 0 ? ' neg' : ''}">${big(bt)}</span><span class="hs-s">Live from ${bankCountedBanks()} ${bankCountedBanks() === 1 ? 'bank' : 'banks'} · updated ${esc(clockTime(state.bank.balances.at))}</span>` : acct === null ? '<span class="v set">Set</span><span class="hs-s">Tap to add${chipHTML}</span>' : `<span class="v${acct < 0 ? ' neg' : ''}">${big(acct)}</span><span class="hs-s">${split(acct).prev > 0.004 ? 'incl. ' + fmt0(split(acct).prev) + ' carried' : state.account.auto ? 'Estimated' : 'Today'}${chipHTML}</span>`}</button>
    </div>`}
    ${!hide && HEROUI.split && dparts.length > 1 ? `<p class="hero-split">Split: ${splitLine(dparts.map(p => ({ acct: p.acct || (p.txn ? acctDots(p.txn) : ''), amount: p.amount })))}</p>` : ''}
    ${uaTotal > 0 ? `<button class="ua-bar" data-action="allocate" data-id="${uaFirst.id}"><b>${hm(uaTotal)} unallocated.</b> Record where it went to see your real spending this cycle.</button>` : ''}
    ${(() => { const n = (state.bank.inbox || []).length; return n ? `<button class="ua-bar bx-bar" data-action="tx-review"><b>${n} new ${n === 1 ? 'transaction' : 'transactions'}</b> from your bank. Review</button>` : ''; })()}
    ${(() => { const n = s.items.filter(x => !x.paid && likelyMap().has(x.key)).length; return n ? `<button class="ua-bar lk-bar" data-action="likely-first"><b>${n} ${n === 1 ? 'bill' : 'bills'} likely completed.</b> Review</button>` : ''; })()}
    ${catBar()}
    <div class="meter" role="img" aria-label="${Math.round(pct)}% paid"><i style="width:${pct}%"></i></div>
    <dl class="hero-stats">
      <div><dt>Spent so far</dt><dd>${hm(s.paid)}</dd>${(() => { const ua = BT.round2(s.items.filter(x => x.kind === 'unalloc').reduce((a, x) => a + x.amount, 0)); return ua > 0 ? `<small class="ss-sub">incl. ${hm(ua)} unallocated</small>` : ''; })()}</div>
      <div><dt>Still due</dt><dd>${hm(s.due)}</dd></div>
      <div><dt>After all bills</dt><dd class="${!hide && s.left < 0 && s.income > 0 ? 'neg' : ''}">${s.income > 0 ? hm(s.left) : 'Set income'}</dd></div>
    </dl>
    ${payPrompt(r) || (pc && !pc.amount && !pc.askFrom ? `<button class="cta" data-action="edit" data-type="income" data-id="${pc.id}">Add your paycheck amount to see what is left over each ${VIEWNAME[view]}.</button>` : '')}
    <div class="hero-foot"><span>Next ${VIEWNAME[view]} needs <b>${hm(ns.needed)}</b></span>${isNow ? '' : '<button class="linkbtn" data-action="today">Back to now</button>'}<span class="sync" data-s="${SYNC.s}" role="status">${esc(SYNC.t)}</span></div>
  </section>
    <section class="card ov-donut"><header class="card-h"><h2>Where this ${VIEWNAME[view]} goes</h2><span class="meta">${fmt(s.needed)}</span></header>
      <div class="card-b">${groups.length ? `<div class="donut-wrap">${donut(groups, s.needed)}</div>${catScroller(groups, s.needed)}<ul class="legend cat-legend">${groups.map((g, gi) => `<li data-i="${gi}" class="${OPEN_CATS.has(g.label) ? 'open' : ''}"><button class="sw-btn" data-action="cat-expand" data-cat="${esc(g.label)}" aria-expanded="${OPEN_CATS.has(g.label)}" aria-label="Show items in ${esc(g.label)}"><span class="sw" style="--c:${g.color}"></span><span class="chev" aria-hidden="true">›</span></button><button class="icon-pick sm" data-action="pick-icon" data-cat="${esc(g.label)}" aria-label="Change icon for ${esc(g.label)}">${catIcon(g.label)}</button><button class="lc" data-action="cat-detail" data-cat="${esc(g.label)}">${esc(g.label)}</button><span class="lv">${fmt(g.value)}</span><span class="lp">${Math.round(g.value / s.needed * 100)}%</span><span class="li">${g.detail}</span></li>`).join('')}</ul>` : '<div class="empty">No spending yet.</div>'}</div>
    </section>
  <section class="card ov-bills"><header class="card-h"><div><h2>Bills this ${VIEWNAME[view]}</h2><span class="meta">${s.items.length - budgets.length} items · ${fmt(s.due)} left</span></div><button class="icon-btn add-big" data-action="add" data-type="extra" aria-label="Add a spending">${ICON.plus}</button></header>
    ${rowsAll}
  </section>
    <section class="card ov-bars"><header class="card-h"><h2>Next 6 ${view === 'biweekly' ? 'pay cycles' : view === 'weekly' ? 'weeks' : 'months'}</h2><span class="meta">Needed vs income</span></header>
      <div class="card-b chart">${periodBars(view)}</div>
      <div class="chart-key"><span><i class="sw" style="--c:var(--s1)"></i>Needed</span>${state.income.some(i => i.amount) ? '<span><i class="ln"></i>Income</span>' : ''}</div>
    </section>
  </div>`;
}

function viewBills() {
  const fixed = live(state.bills).filter(b => b.group === 'Fixed');
  const subs = live(state.bills).filter(b => b.group !== 'Fixed');
  const per = live(state.perPeriod).reduce((a, b) => a + b.amount, 0);
  const archived = [...state.bills.filter(b => b.endDate).map(b => ({ type: 'bill', i: b, nm: b.name, amt: b.amount })),
    ...state.perPeriod.filter(b => b.endDate).map(b => ({ type: 'spend', i: b, nm: b.name, amt: b.amount })),
    ...state.cards.filter(b => b.endDate).map(b => ({ type: 'card', i: b, nm: b.name, amt: b.minPayment }))];
  const all = monthlyTotal(state.bills) + per * 2;
  const cards = BILL_GROUPS.map(g => {
    const list = live(state.bills).filter(b => (BILL_GROUPS.includes(b.group) ? b.group : 'Other bills') === g).sort((a, b) => a.day - b.day);
    if (!list.length && g === 'Other bills') return '';
    return `<section class="card"><header class="card-h"><div><h2><span class="dot" style="--c:${gc(g)};display:inline-block;margin-right:8px"></span>${g}</h2></div>
      <div class="r"><span class="meta">${fmt(monthlyTotal(list))}/mo</span><button class="icon-btn" data-action="add" data-type="bill" data-group="${g}" aria-label="Add to ${g}">${ICON.plus}</button></div></header>
      ${list.length ? `<ul class="rows">${list.map(b => `<li class="row tap" data-action="edit" data-type="bill" data-id="${b.id}" tabindex="0" role="button" aria-label="Edit ${esc(b.name)}">
        <span></span><div class="daybadge">${ord(b.day)}</div><div class="main"><div class="nm">${esc(b.name)}${b.active === false ? ' <span class="pill soft">Paused</span>' : ''}${(() => { const k = likelyKeyFor('bill', b.id); return k ? likelyPill(k) : ''; })()}</div><div class="sub">${b.category ? catIcon(b.category) + '<span class="bcat">' + esc(b.category) + '</span> · ' : ''}${b.note ? esc(b.note) + ' · ' : ''}Due the ${ord(b.day)}${b.via ? ' <span class="tag via">via ' + esc(viaText(b.via)) + '</span>' : ''}</div>${(() => { const k = likelyKeyFor('bill', b.id); return k ? likelyDetail(k) : ''; })()}</div><div class="amt">${fmt(b.amount)}</div></li>`).join('')}</ul>` : '<div class="empty">No items yet.</div>'}
    </section>`;
  });
  return `<div class="stack">
    <div class="strip">
      <div class="tile"><div class="k"><span class="dot" style="--c:var(--s1)"></span>Fixed</div><div class="v">${fmt0(monthlyTotal(fixed))}<small>/mo</small></div></div>
      <div class="tile"><div class="k"><span class="dot" style="--c:var(--s3)"></span>Subscriptions</div><div class="v">${fmt0(monthlyTotal(subs))}<small>/mo</small></div></div>
      <div class="tile"><div class="k"><span class="dot" style="--c:var(--s5)"></span>Budgets</div><div class="v">${fmt0(per)}<small>×2/mo</small></div></div>
      <div class="tile"><div class="k">All recurring</div><div class="v">${fmt0(all)}<small>/mo</small></div></div>
    </div>
    <div class="grid-2"><div class="stack">${cards.slice(0, 2).join('')}</div>
    <div class="stack">${cards.slice(2).join('')}
      <section class="card"><header class="card-h"><div><h2><span class="dot" style="--c:var(--s5);display:inline-block;margin-right:8px"></span>Budgets</h2></div>
        <div class="r"><span class="meta">${fmt(per)} each cycle</span><button class="icon-btn" data-action="add" data-type="spend" aria-label="Add a budget">${ICON.plus}</button></div></header>
        <div class="card-b note" style="padding-bottom:6px">No due dates. Spending in a budget's category counts toward it, once per pay cycle.</div>
        ${(() => { const cyc = BT.summary(state, BT.periodRange(state, 'biweekly', 0, TODAY), TODAY).items.filter(x => x.kind === 'spend'); return cyc.length ? `<div class="subhead bud-h">Budgets this cycle</div><ul class="rows bud-rows">${cyc.map(budgetRow).join('')}</ul>` : '<div class="empty">No budgets yet.</div>'; })()}
      </section>
      ${archived.length ? `<section class="card"><header class="card-h"><h2>Archived</h2><span class="meta">No longer scheduled</span></header>
        <ul class="rows">${archived.map(a => `<li class="row"><span></span><div class="daybadge">${catIcon(a.i.category || 'Other bills')}</div><div class="main"><div class="nm">${esc(a.nm)}</div><div class="sub">Stopped ${md(a.i.endDate)}</div></div><button class="btn sm" data-action="restore-item" data-type="${a.type}" data-id="${a.i.id}">Restore</button></li>`).join('')}</ul></section>` : ''}
    </div></div></div>`;
}

function needCat() { return state.plans.filter(p => !p.category && !p.endDate && !BT.planStatus(state, p, TODAY).completed); }
function catBar() {
  const n = needCat();
  return n.length ? `<button class="ua-bar cat-bar" data-action="next-cat"><b>${n.length} ${n.length === 1 ? 'purchase needs' : 'purchases need'} a category.</b> ${esc(n.map(p => p.merchant).join(', '))}. Tap to pick.</button>` : '';
}
let catChain = false;
function viewPlans() {
  const st = state.plans.map(p => ({ p, s: BT.planStatus(state, p, TODAY) }));
  const active = st.filter(x => !x.s.completed && !x.p.endDate).sort((a, b) => (a.s.next ? a.s.next.date : '9') < (b.s.next ? b.s.next.date : '9') ? -1 : 1);
  const done = st.filter(x => x.s.completed || x.p.endDate);
  const prov = PROVIDERS.map(pv => {
    const l = active.filter(x => x.p.provider === pv);
    return `<div class="tile"><div class="k">${pv}</div><div class="v">${fmt0(l.reduce((a, x) => a + x.s.owed, 0))}<small>${l.length} active</small></div></div>`;
  }).join('');
  const card = ({ p, s }) => `<div class="plan" data-action="edit" data-type="plan" data-id="${p.id}" tabindex="0" role="button" aria-label="Edit ${esc(p.merchant)}">
    <div class="plan-h"><div class="main"><div class="nm">${esc(p.merchant)}</div><div class="sub" style="margin-top:4px"><span class="tag prov-tag">${esc(p.provider)}</span><button class="tag" data-action="pick-cat" data-id="${p.id}">${p.category ? catIcon(p.category) : ''}${esc(p.category || 'Add category')}</button><span class="bought">Bought ${md(s.purchased)}</span></div></div>
      <div style="text-align:right"><div class="amt">${fmt(s.next ? s.next.amount : p.amount)}</div><div class="sub" style="justify-content:flex-end">${FREQ[p.freq]}</div></div></div>
    <div class="pips" role="img" aria-label="${s.paidCount} of ${p.total} paid">${Array.from({ length: p.total }, (_, i) => `<i class="${i < s.paidCount ? 'on' : s.next && i === s.next.n - 1 ? 'nx' : ''}"></i>`).join('')}</div>
    <div class="plan-f">${p.endDate ? `<span>Stopped ${md(p.endDate)}</span><button class="btn sm" data-action="restore-item" data-type="plan" data-id="${p.id}">Restore</button>` : s.completed ? `<span>Paid in full · ${p.total} of ${p.total}</span>` : `<span>Next <b>${lng(s.next.date)}</b> · payment ${s.next.n} of ${p.total}</span>`}<span>${s.completed ? fmt(s.total) + ' total' : '<b>' + fmt(s.owed) + '</b> left'}</span></div>
    ${!s.completed && !p.endDate ? `<div class="plan-f plan-end"><span>${s.left} ${s.left === 1 ? 'payment' : 'payments'} left</span><span>Ends <b>${lng(s.ends)}</b></span></div>` : ''}
  </div>`;
  // Category chart: total purchase value per category, all plans
  const byCat = {};
  st.forEach(({ p, s }) => { const c = p.category || 'Uncategorized'; byCat[c] = BT.round2((byCat[c] || 0) + s.total); });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  return `<div class="stack">
    ${catBar()}
    <div class="prov">${prov}</div>
    <div class="grid-2"><div class="stack">
      <section class="card"><header class="card-h"><h2>Active plans</h2><span style="display:flex;gap:8px"><button class="btn sm" data-action="bank-import">Import bank CSV</button><button class="btn primary sm" data-action="add" data-type="plan">${ICON.plus}Log purchase</button></span></header>
        ${active.length ? active.map(card).join('') : '<div class="empty">No active plans. Log a Klarna, Afterpay or PayPal purchase to auto-schedule its payments.</div>'}
        ${done.length ? `<details class="done"><summary>Completed (${done.length})</summary>${done.map(card).join('')}</details>` : ''}
      </section>
      <p class="note">Enter the <b>last payment you made</b> and its number, for example payment 3 of 4 on Nov 13. Each next payment is scheduled automatically. Scheduling stops after the final payment.</p>
    </div>
    <section class="card"><header class="card-h"><h2>Spending by category</h2><span class="meta">Purchase totals</span></header>
      <div class="card-b">${cats.length ? `<div class="hbars">${cats.map(([c, v]) => `<div class="hbar" data-tip="${esc(c)}\n${fmt(v)}"><span class="l">${catIcon(c)}${esc(c)}</span><span class="tr"><span class="fl" style="display:block;width:${Math.max(3, v / max * 100)}%"></span></span><span class="v">${fmt0(v)}</span></div>`).join('')}</div>` : '<div class="empty">Categories appear once you log purchases.</div>'}</div>
    </section></div></div>`;
}

function viewCards() {
  const cards = state.cards;
  const bal = cards.reduce((a, c) => a + (c.balance || 0), 0), lim = cards.reduce((a, c) => a + (c.limit || 0), 0);
  const mins = cards.reduce((a, c) => a + (c.minPayment || 0), 0);
  const util = c => c.limit ? c.balance / c.limit * 100 : 0;
  const ustat = u => u < 30 ? ['good', 'Healthy'] : u < 50 ? ['warn', 'Watch'] : ['crit', 'High'];
  return `<div class="stack">
    <div class="strip">
      <div class="tile"><div class="k">Total balance</div><div class="v">${fmt0(bal)}</div></div>
      <div class="tile"><div class="k">Utilization</div><div class="v">${lim ? Math.round(bal / lim * 100) + '%' : 'None'}</div></div>
      <div class="tile"><div class="k">Minimums</div><div class="v">${fmt0(mins)}<small>/mo</small></div></div>
    </div>

// Drag a bank by its grip (pointer events: mouse, pen and touch). Rows slide aside while dragging; the sheet scrolls near its edges.

  if (bankHas()) state.bank.useBankBalance = false; // a hand-entered balance wins over the live one
  const cur = BT.accountBalance(state, TODAY);
  if (cur === null || (f.elements.fresh && f.elements.fresh.checked)) {
    state.account = { balance: 0, asOf: TODAY, adj: [] };
    state.account.balance = BT.round2(v - BT.accountBalance(state, TODAY));
    closeSheet(); commit('Balance set'); return;
  }
  // Compare with what BudTracks expects (estimate or tracked balance). From now on it is a real balance.
  delete state.account.auto;
  const d = BT.round2(cur - v);
  if (d > 0) {
    let u = state.unalloc[0];
    if (u) { u.amount = BT.round2(u.amount + d); u.date = TODAY; }
    else { u = { id: uid('u'), date: TODAY, amount: d }; state.unalloc.push(u); }
    closeSheet(); commit(fmt(d) + ' added to unallocated');
    setTimeout(() => allocSheet(u.id), 250);
  } else if (d < 0) {
    (state.account.adj || (state.account.adj = [])).push({ date: TODAY, amount: -d });
    closeSheet(); commit('Balance updated');
  } else { closeSheet(); commit('Balance confirmed'); }
}

// Splits the account into what is left of this paycheck and what carried over from earlier ones.
function split(total) {
  const s = BT.summary(state, BT.periodRange(state, 'biweekly', 0, TODAY), TODAY);
  const cur = BT.round2(Math.min(total, s.income - s.paid));
  return { cur, prev: BT.round2(total - cur), date: s.inc[0] && s.inc[0].date };
}

function readAlloc() {

    desc: r.querySelector('[name=desc]').value.trim(), date: r.querySelector('[name=date]').value, note: r.querySelector('[name=note]').value.trim()

  }

}

/* ---------- Sound ---------- */
let AC = null;
// Cash register "cha-ching": key clunk + drawer slam, then the bell and a coin rattle.
function chime() {
  if (state.settings.sound === false) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + 0.01, out = AC.createGain(); out.gain.value = 0.5; out.connect(AC.destination);
    const noise = (at, len, type, freq, q, vol) => {
      const n = AC.createBuffer(1, Math.ceil(AC.sampleRate * len), AC.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
      const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
      s.buffer = n; s.connect(f); f.connect(g); g.connect(out); s.start(at);
    };
    const tone = (at, f, len, vol, type) => {
      const o = AC.createOscillator(), g = AC.createGain();

      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(g); g.connect(out); o.start(at); o.stop(at + len + 0.05);
    };
    // "cha": lever clunk and drawer
    noise(t0, 0.06, 'bandpass', 1800, 1.2, 0.9);
    tone(t0, 95, 0.12, 0.5, 'triangle');
    noise(t0 + 0.07, 0.16, 'lowpass', 900, 0.7, 0.6);
    tone(t0 + 0.08, 70, 0.18, 0.35, 'triangle');
    // "ching": bright bell with inharmonic partials
    const b = t0 + 0.2;
    [[2637, 0.42, 1.3], [5274 * 1.003, 0.16, 0.8], [7120, 0.1, 0.5], [3956, 0.12, 0.9], [9890, 0.05, 0.3]].forEach(([f, v, l]) => tone(b, f, l, v));

  if (m < 1440) return Math.round(m / 60) + ' h ago';

}
