<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BudTracks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: one column on phones, overview splits into ledger + charts on wide screens.
   Bold moment: the "cycle card" with a serif figure (navy in dark mode, a light card in light mode). Everything else stays quiet. */
:root {
  --bg: #eceef2; --surface: #ffffff; --surface-2: #f5f6f9; --line: #e0e3e9; --line-2: #c9ced8;
  /* Light: muted text, brass, good and crit are dark enough for 4.5:1 on --bg and --surface-2. */
  --ink: #111726; --ink-2: #454f62; --ink-3: #5d6577;
  --hero: #15203a; --hero-2: #22305180; --hero-ink: #f5f1e7; --hero-ink-2: #b7bdcb; --hero-line: #2c3a5a;
  /* Navy cycle card details (the light theme redefines these below) */
  --hero-neg: #ff9d9d; --hero-hover: #ffffff10; --hero-fill: #ffffff0f; --hero-track: #ffffff1a; --hero-input: #0000004d; --hero-border: var(--hero-line);
  --hero-logo: #f2a48a; --hero-glow-l: 65%; --hero-dim: .45; --hero-stamp: #c9cfdc; --hero-stamp-sh: 0 1px 0 #0b1222, 0 2px 0 #0a101e, 0 2px 3px #0008, 0 -1px 0 #ffffff22;
  --brass: #845c1a; --brass-hi: #d8b26a;
  --accent: #1d3a72; --accent-ink: #ffffff; --accent-soft: #e5ebf6;
  --good: #0a7f0a; --warn: #fab219; --crit: #b8322f; --on-brass: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s9: #0e8fa3; --s10: #a0527c; --s11: #6b7280; --s12: #8bb12a;
  --display: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --body: 'Geist', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 16px; --shadow: 0 1px 2px #1117260d, 0 8px 24px -12px #1117261f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0f15; --surface: #151a23; --surface-2: #1b212c; --line: #252c39; --line-2: #343d4d;
    --ink: #eef0f4; --ink-2: #b5bbc7; --ink-3: #969dac;
    --hero: #18243f; --hero-line: #2d3c5e; --brass: #d8b26a; --brass-hi: #e6c88d; --good: #0ca30c; --crit: #e86a6a; --on-brass: #1a1408;
    --accent: #8fb0ee; --accent-ink: #0c1424; --accent-soft: #1d2840;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s9: #2aa8bd; --s10: #c36a9a; --s11: #8b93a1; --s12: #9cc83a;
    --shadow: 0 1px 2px #0006, 0 8px 24px -12px #0009;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0f15; --surface: #151a23; --surface-2: #1b212c; --line: #252c39; --line-2: #343d4d;
  --ink: #eef0f4; --ink-2: #b5bbc7; --ink-3: #969dac;
  --hero: #18243f; --hero-line: #2d3c5e; --brass: #d8b26a; --brass-hi: #e6c88d; --good: #0ca30c; --crit: #e86a6a; --on-brass: #1a1408;
  --accent: #8fb0ee; --accent-ink: #0c1424; --accent-soft: #1d2840;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --s9: #2aa8bd; --s10: #c36a9a; --s11: #8b93a1; --s12: #9cc83a;
  --shadow: 0 1px 2px #0006, 0 8px 24px -12px #0009;
  color-scheme: dark;
}
/* Light theme (chosen, or Auto with a light phone): the cycle card is a light card too. Dark keeps the navy card. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --hero: #ffffff; --hero-2: #f5f6f9; --hero-ink: #111726; --hero-ink-2: #454f62; --hero-line: #dde1e8; --hero-border: var(--line);
    --hero-neg: #b8322f; --hero-hover: #1117260a; --hero-fill: #f5f6f9; --hero-track: #e3e6ec; --hero-input: #ffffff;
    --hero-logo: #c2532f; --hero-glow-l: 48%; --hero-glow-sh: #0000; --hero-dim: .62; --hero-stamp: #5d6577; --hero-stamp-sh: 0 1px 0 #ffffff;
  }
  :root:not([data-theme="dark"]) .hero, :root:not([data-theme="dark"]) .brandbar { --brass-hi: #845c1a; }
  :root:not([data-theme="dark"]) .hero .lad .v.dim small { color: inherit; }
}
:root[data-theme="light"] {
  --hero: #ffffff; --hero-2: #f5f6f9; --hero-ink: #111726; --hero-ink-2: #454f62; --hero-line: #dde1e8; --hero-border: var(--line);
  --hero-neg: #b8322f; --hero-hover: #1117260a; --hero-fill: #f5f6f9; --hero-track: #e3e6ec; --hero-input: #ffffff;
  --hero-logo: #c2532f; --hero-glow-l: 48%; --hero-glow-sh: #0000; --hero-dim: .62; --hero-stamp: #5d6577; --hero-stamp-sh: 0 1px 0 #ffffff;
}
:root[data-theme="light"] .hero, :root[data-theme="light"] .brandbar { --brass-hi: #845c1a; }
:root[data-theme="light"] .hero .lad .v.dim small { color: inherit; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num, .amt, td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.app { max-width: 1080px; margin: 0 auto; padding: 14px 16px 104px; display: grid; gap: 16px; }
.mark { font-family: var(--display); font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
.mark i { color: var(--brass); font-style: italic; }
.sync { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.sync[data-s="ok"]::before { background: var(--good); }
.sync[data-s="busy"]::before { background: var(--warn); }
.sync[data-s="err"]::before { background: var(--crit); }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.grid-2 { display: grid; gap: 16px; }
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) { .grid-2 { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } }
.stack { display: grid; gap: 16px; }

/* Cycle card */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 18px 18px 16px; position: relative; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--hero-border); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero-top .lbl { text-align: center; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-hi); font-weight: 600; }
.range { font-size: 14px; color: var(--hero-ink-2); margin-top: 2px; }
.navbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--hero-line); background: transparent; color: var(--hero-ink); display: grid; place-items: center; }
.navbtn:hover { background: var(--hero-hover); }
.hero-num { text-align: center; margin: 14px 0 4px; }
.hero-num .big { font-family: var(--display); font-size: clamp(52px, 13vw, 72px); line-height: .95; letter-spacing: -0.02em; display: block; }
.hero-num .big small { font-size: .5em; vertical-align: .62em; margin-right: 2px; color: var(--hero-ink-2); }
.hero-num .cap { font-size: 13px; color: var(--hero-ink-2); }
.meter { height: 6px; border-radius: 99px; background: var(--hero-track); margin: 14px 2px 12px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--brass-hi); }
/* Same tracks as the ladder above (margin -6px, no gap, 6px cell padding, centered) so each stat sits under its sum. */
.hero-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 0; row-gap: 8px; margin: 0 -6px; text-align: center; container-type: inline-size; }
.hero-stats > div { min-width: 0; padding: 0 6px; }
.hero-stats dt { font-size: 11px; color: var(--hero-ink-2); }
.hero-stats dd { margin: 2px 0 0; font-family: var(--mono); font-size: clamp(12px, 4.4cqi, 14px); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-stats .neg { color: var(--hero-neg); }

.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hero-line); font-size: 13px; color: var(--hero-ink-2); }
.hero-due { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; font-size: 13px; text-align: left; cursor: pointer; white-space: nowrap; }
.hero-foot .hf-next { white-space: nowrap; }
.hero-due .nbadge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #d3282b; color: #fff; font: 700 12px/20px var(--body); text-align: center; }
.hero-due .hd-none { color: var(--hero-ink-2); }
.hero-due::after { content: "›"; opacity: .6; }
#ptr { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%; z-index: 60; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.18); color: var(--ink-3); transform: translate(-50%, -50px); opacity: 0; pointer-events: none; transition: opacity .15s; }
#ptr.on { opacity: 1; }
#ptr.ready { color: var(--accent, var(--ink)); }
#ptr svg { width: 18px; height: 18px; }
.hero-foot b { color: var(--hero-ink); font-family: var(--mono); font-weight: 500; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brass); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.hero .linkbtn { color: var(--brass-hi); }
.cta { display: block; width: 100%; margin-top: 12px; text-align: left; background: var(--hero-fill); border: 1px dashed var(--brass-hi); color: var(--hero-ink); border-radius: 12px; padding: 10px 12px; font-size: 13px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; }
.card-h h2 { font-size: 15px; font-weight: 600; }
.card-h .meta { font-size: 12.5px; color: var(--ink-3); }
.card-h .r { display: flex; align-items: center; gap: 8px; }
.card-b { padding: 0 16px 16px; }
.muted { color: var(--ink-3); }

.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.danger.arm { background: var(--crit); color: #fff; }
.btn.sm { padding: 5px 9px; font-size: 12.5px; border-radius: 8px; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; padding: 0; }

/* Ledger rows */
.rows { list-style: none; margin: 0; padding: 0 8px 8px; }
.row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row.is-next { background: color-mix(in srgb, var(--brass-hi) 14%, transparent); border-top-color: transparent; }
.row.is-next + .row { border-top-color: transparent; }
.row.is-paid .nm, .row.is-paid .amt { color: var(--ink-3); }
.row.is-paid .amt { text-decoration: line-through; text-decoration-color: var(--line-2); }
.row.tap { cursor: pointer; }
.row.tap:hover { background: var(--surface-2); }
.check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-2); background: transparent; display: grid; place-items: center; padding: 0; color: transparent; }
.check[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.check svg { width: 14px; height: 14px; }
.date { width: 40px; text-align: center; line-height: 1.05; }
.date .dow { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.date .dd { display: block; font-family: var(--display); font-size: 24px; }
.daybadge { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.main { min-width: 0; }
.nm { font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; overflow-wrap: anywhere; }
.sub { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.amt { font-size: 14px; text-align: right; white-space: nowrap; }
.pill { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--ink); color: var(--bg); }
.pill.brass { background: var(--brass); color: var(--on-brass); }
.pill.soft { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.warn::before { content: "! "; color: var(--warn); }
.empty { padding: 18px 16px 22px; color: var(--ink-3); font-size: 14px; display: grid; gap: 10px; justify-items: start; }

/* Totals strip */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--display); font-size: 28px; line-height: 1.1; margin-top: 2px; }
.tile .v small { font-family: var(--body); font-size: 12px; color: var(--ink-3); margin-left: 4px; }

/* Charts */
.donut-wrap { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 420px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } }
.donut-wrap svg { width: 170px; height: 170px; display: block; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; }
.legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 40px; align-items: center; gap: 8px; font-size: 13px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.legend .lv { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.legend .lp { font-family: var(--mono); color: var(--ink-3); text-align: right; font-size: 12px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--ink-3); }
.chart .lbl-strong { fill: var(--ink); font-weight: 500; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-2); stroke-width: 1; }
.chart-key { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); padding: 0 16px 12px; flex-wrap: wrap; }
.chart-key span { display: inline-flex; align-items: center; gap: 6px; }
.chart-key .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.chart-key .ln { width: 16px; height: 0; border-top: 2px solid var(--brass); }
.chart-key .ln.est { border-top-style: dashed; opacity: .75; }
.chart-key .sw.cur { background: color-mix(in srgb, var(--brass) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brass) 40%, var(--line)); }
.chart .ib text { font-size: 10.5px; }
.chart .ib .ib-cur { fill: color-mix(in srgb, var(--brass) 10%, transparent); stroke: color-mix(in srgb, var(--brass) 35%, transparent); stroke-width: 1; }
.chart .ib .ib-line { stroke: var(--brass); stroke-width: 2; }
.chart .ib .ib-line.est { stroke-dasharray: 4 3; opacity: .7; }
.chart .ib .ib-pt circle { fill: var(--brass); stroke: var(--surface); stroke-width: 1.5; }
.chart .ib .ib-pt.est circle { fill: var(--surface); stroke: var(--brass); stroke-width: 1.5; stroke-dasharray: 2 1.5; }
.chart .ib .ib-v, .chart .ib .ib-d { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.chart .ib .ib-v { fill: var(--ink); font-weight: 500; }
.chart .ib .ib-pt.est .ib-v { fill: var(--ink-2); font-weight: 400; }
.chart .ib .ib-d { font-size: 9.5px; }
.chart .ib .ib-d.up { fill: var(--good); } .chart .ib .ib-d.down { fill: var(--crit); } .chart .ib .ib-d.eq { fill: var(--ink-3); }
.chart .ib .ib-est { font-size: 9.5px; font-style: italic; fill: var(--ink-3); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .tr { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hbar .fl { height: 100%; background: var(--c, var(--s1)); border-radius: 99px; }
.hbar .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.hbar .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Plans */
.prov { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.plan { padding: 14px 16px; display: grid; gap: 10px; border-top: 1px solid var(--line); cursor: pointer; }
.plan:first-of-type { border-top: 0; }
.plan:hover { background: var(--surface-2); }
.plan { gap: 8px; }
.pc-r1, .pc-r2, .pc-r3 { display: flex; align-items: center; gap: 4px 10px; min-width: 0; }
.pc-r1 { justify-content: space-between; align-items: flex-start; }
.pc-r1 .nm { font-size: 16px; font-weight: 700; min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; }
.pc-r1 .amt, .pc-r1 .pc-dd { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; font-size: 20px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.pc-nx { display: flex; flex-direction: column; align-items: flex-end; flex: none; gap: 1px; text-align: right; }
.pc-nx .pc-due { margin: 0; display: flex; align-items: baseline; gap: 6px; }
.pc-dl { font: 500 12px/1 var(--body); color: var(--ink-3); letter-spacing: 0; }
.pc-due.late .pc-dl { color: color-mix(in srgb, var(--warn) 65%, var(--ink)); }
.pc-due.late .pc-dd { color: color-mix(in srgb, var(--warn) 65%, var(--ink)); }
.pc-due.done { font: 600 13px/1.2 var(--body); }
.pc-nx .pc-due.done { margin-top: 2px; }
.pc-r2 { flex-wrap: wrap; justify-content: space-between; }
.pc-l { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.pc-l .tag { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-due { font-size: 13px; color: var(--ink); white-space: nowrap; margin-left: auto; }
.pc-due.late { color: color-mix(in srgb, var(--warn) 65%, var(--ink)); font-weight: 600; }
.pc-due.done { color: var(--good); font-weight: 600; }
.pc-r3 .pips { flex: 1; min-width: 0; }
.pc-n { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pc-r4 { font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; justify-content: space-between; }
.pc-r4 .pc-t { min-width: 0; overflow-wrap: anywhere; }
.pc-r4 .pc-t em { font-style: normal; }

.slogo { position: relative; display: inline-grid; place-items: center; flex: none; width: var(--s, 22px); height: var(--s, 22px); border-radius: calc(var(--s, 22px) * .28); background: var(--bg, hsl(var(--h, 200) 42% 40%)); color: var(--fg, #fff); font: 700 calc(var(--s, 22px) * var(--fk, .5)) / 1 var(--body); overflow: hidden; vertical-align: middle; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 16%, transparent); }

/* BudTracks wordmark: coral, one color. The navy hero uses the light coral; the light hero uses the darker one (--hero-logo). */
:root { --logo: #c2532f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --logo: #f2a48a; } }
:root[data-theme="dark"] { --logo: #f2a48a; }
.wm { position: relative; display: inline-flex; align-items: flex-end; font: 400 32px/1 var(--display); letter-spacing: -.01em; padding-top: 1.5em; color: var(--logo); white-space: nowrap; }
.brandbar .wm { --logo: var(--hero-logo); font-size: var(--wmf); }

.wm .stem { display: inline-block; width: .1em; height: .68em; margin: 0 0 .1em .1em; visibility: hidden; }

.wm svg.hd { cursor: pointer; }
.wm svg.hd:focus-visible { outline: 2px solid var(--brass-hi); border-radius: 8px; }
.hat-prev { display: grid; place-items: center; background: #15203a; border-radius: 14px; padding: 16px; margin-bottom: 12px; }

.hat-sw { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sw-c { width: 38px; height: 38px; border-radius: 50%; background: var(--c); border: 2px solid var(--line-2); padding: 0; }
.sw-c[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
.sw-custom { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.sw-custom input { width: 38px; height: 38px; border: 0; padding: 0; background: none; border-radius: 50%; }
/* One persistent brand header (Bud, laptop, wordmark, glow, Saved pill) above every tab. On Overview it is the top of the cycle card. */
:root { --wmf: clamp(44px, 15vw, 68px); }
.brandbar { --hbar: #0f172e; position: relative; display: flex; justify-content: center; align-items: flex-end; background: var(--hbar); color: var(--hero-ink); border: 1px solid var(--hero-border); border-radius: 22px; box-shadow: var(--shadow); padding: 32px 18px calc(var(--wmf) * .32); min-width: 0; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .brandbar { --hbar: #e3e8f2; } }
:root[data-theme="light"] .brandbar { --hbar: #e3e8f2; }
.brandbar .sync { position: absolute; top: 7px; right: 12px; z-index: 3; max-width: calc(100% - 132px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; line-height: 14px; padding: 2px 9px 2px 8px; border-radius: 999px; border: 1px solid var(--hero-line); color: var(--hero-ink-2); }
.app[data-tab="overview"] .brandbar { background: var(--hero); border-bottom-color: var(--hero); border-radius: 22px 22px 0 0; box-shadow: none; margin-bottom: -16px; }
/* Period button (top-left of the header) and its menu */
.brandbar .period { position: absolute; top: 5px; left: 10px; z-index: 3; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px 0 10px; border-radius: 999px; border: 1px solid var(--hero-line); background: transparent; color: var(--hero-ink-2); font-size: 12px; font-weight: 600; line-height: 1; }
.brandbar .period::after { content: ""; position: absolute; inset: -9px -4px; }
.brandbar .period svg { transition: transform .15s ease; }
.brandbar .period[aria-expanded="true"] svg { transform: rotate(180deg); }
.brandbar .period:hover, .brandbar .period[aria-expanded="true"] { color: var(--hero-ink); background: var(--hero-hover); }
.pmenu { position: absolute; top: 36px; left: 8px; z-index: 40; min-width: 156px; padding: 4px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 12px 32px -8px #0009, 0 2px 6px #0004; display: grid; gap: 2px; }
.pmenu[hidden] { display: none; }
.pmenu button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0 12px 0 28px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; text-align: left; position: relative; }
.pmenu button:hover, .pmenu button:focus-visible { background: var(--surface-2); }
.pmenu button[aria-checked="true"] { font-weight: 700; }
.pmenu button[aria-checked="true"]::before { content: ""; position: absolute; left: 10px; top: 50%; width: 5px; height: 9px; margin-top: -6px; border: solid var(--accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
/* Tab content fades in on a tab change; the header never moves */
@keyframes tabIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#main.tabin { animation: tabIn .18s ease-out; }
@media (prefers-reduced-motion: reduce) { #main.tabin { animation: none; } }
/* iOS-style new-data badge on a tab icon */
.tabs a { position: relative; }
.tabs .badge { position: absolute; top: 0; left: calc(50% + 2px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #d3282b; color: #fff; font: 700 11px/18px var(--body); text-align: center; letter-spacing: 0; box-shadow: 0 0 0 2px var(--bg); pointer-events: none; }

.app[data-tab="overview"] .hero { border-top: 0; border-radius: 0 0 22px 22px; padding-top: 6px; }
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) {
  /* Overview: the bar tops the left column and merges into the cycle card. Other tabs: full width, logo centered. */
  .app[data-tab="overview"] .brandbar { width: calc((100% - 16px) * .43); }
  /* Chart card starts level with the top of the bar (--bb-h is the bar height, set from JS) and ends with the cycle card. */
  .app[data-tab="overview"] .ov > .ov-donut { margin-top: calc(-1 * var(--bb-h, 0px)); }
  /* The stretched card keeps its content together in the middle instead of spreading rows apart. */

}

/* Bud speech bubble: navy cloud with thought dots, same navy as the cycle card */
.bud { position: fixed; z-index: 65; background: #15203a; color: #f5f1e7; border-radius: 26px; padding: 12px 18px; font: 600 13.5px/1.35 var(--body);
  box-shadow: 0 0 0 1.5px #2c3a5a, 0 10px 24px #0006; pointer-events: none; opacity: 0; transform: translateY(6px) scale(.94); transform-origin: left bottom; transition: opacity .15s, transform .15s; }
.bud.on { opacity: 1; transform: none; }

.bud .pf, .bud .dot { position: absolute; background: #15203a; border-radius: 50%; box-shadow: 0 0 0 1.5px #2c3a5a; }
.bud .pf { z-index: -1; }
.bud .p1 { width: 34px; height: 34px; top: -12px; left: 16%; }
.bud .p2 { width: 44px; height: 44px; top: -18px; left: 40%; }
.bud .p3 { width: 30px; height: 30px; top: -10px; left: 70%; }
.bud .pf::after { content: ""; position: absolute; inset: 1.5px; border-radius: 50%; background: #15203a; }
.bud::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: #15203a; z-index: 0; }
.bud .d1 { width: 12px; height: 12px; left: -10px; bottom: 6px; }
.bud .d2 { width: 7px; height: 7px; left: -20px; bottom: 0; }
.bud.left { transform-origin: right bottom; }
.bud.left .d1 { left: auto; right: -10px; } .bud.left .d2 { left: auto; right: -20px; }
.bud.float { left: auto; right: 14px; top: auto; bottom: calc(86px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; border-radius: 16px; padding: 6px 12px 6px 6px; }
.bud.float::before { display: none; }
.bud .mini { width: 44px; height: 36px; flex: none; }
.bud .mini { background: #15203a; border-radius: 10px; padding: 2px; }
@media (max-width: 600px) { .bud.float { bottom: calc(140px + env(safe-area-inset-bottom)); } }

/* Overview grid: row 1 = cycle card + donut (same height), row 2 = bills + 6-cycle chart. */
.ov { --wmf: clamp(44px, 15vw, 68px); display: grid; gap: 16px; grid-template-columns: 1fr; }
.ov > .hero { order: 1; } .ov > .ov-bills { order: 2; } .ov > .ov-donut { order: 3; } .ov > .ov-bars { order: 4; }

  .ov > .ov-bills, .ov > .ov-bars { align-self: start; }
  .ov-donut .card-b { flex: 1; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
  .ov-donut .donut-wrap svg { width: 150px; height: 150px; }

}
@media (min-width: 900px), (orientation: landscape) and (min-width: 740px) {
  .ov-donut .card-b { grid-template-columns: minmax(180px, .9fr) minmax(0, 1.25fr); gap: 22px; }
  .ov-donut .donut-wrap svg { width: 100%; height: auto; max-width: 230px; }
  .ov-donut .cat-legend > li.lg-g { font-size: 12.5px; grid-template-columns: auto auto minmax(0, 1fr) auto 32px; column-gap: 6px; }
  .ov-donut .cat-legend .lg-kids { padding-left: 28px; }
  .ov-donut .cat-legend .lv { font-size: 12px; }
}

/* Top glow behind Bud: drifts through colors, rainbow burst after a change */
@property --gh { syntax: '<number>'; inherits: false; initial-value: 40; }
.brandbar::before { content: ""; position: absolute; inset: 0 0 auto; border-radius: 22px 22px 0 0; --gh: 40; height: 2px; background: linear-gradient(90deg, transparent, hsl(var(--gh) 75% var(--hero-glow-l)), transparent); opacity: .9; animation: glowDrift 14s linear infinite; }
@keyframes glowDrift { to { --gh: 400; } }
/* Rainbow layer fades in and out and dissolves toward the edges */
.brandbar::after { content: ""; position: absolute; top: 0; left: 6%; right: 6%; height: 3px; pointer-events: none;
  background: linear-gradient(90deg, #ff4d4d, #ffa64d, #ffe14d, #4dff88, #4dc3ff, #8f6bff, #ff4dc4, #ff4d4d); background-size: 200% 100%;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  filter: drop-shadow(0 0 5px var(--hero-glow-sh, #ffffff55)); opacity: 0; transition: opacity 1.6s ease; animation: rainbow .9s linear infinite; }
.brandbar.party::after { opacity: 1; }
.brandbar::before { -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
@keyframes rainbow { to { background-position: 200% 0; } }
@media (prefers-reduced-motion: reduce) { .brandbar::before, .brandbar::after { animation: none; } }
/* Keep the glow lines behind Bud and the laptop */
.brandbar::before, .brandbar::after { z-index: 0; }
.wm svg.hd { z-index: 2; }

/* Maker's stamp under the logo */
.hero .byline { position: absolute; right: 0; bottom: 10px; font: italic 400 13px/1 var(--display); letter-spacing: .02em; color: var(--hero-ink-2); opacity: .55; }
.hero .byline::before { content: ""; display: inline-block; width: 18px; height: 1px; background: currentColor; vertical-align: middle; margin-right: 7px; opacity: .7; }
@media (max-width: 420px) { .hero .byline { position: static; } }
/* Stamp: smaller, no dash, engraved 3D letters */
.hero .byline { font-size: 11px; opacity: .8; color: var(--hero-stamp); letter-spacing: .04em;
  text-shadow: var(--hero-stamp-sh); }
.hero .byline::before { display: none; }

<script>
/* BudTrack core: pure date + budget logic. No DOM. */
const BT = (() => {
  const DAY = 86400000;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();
  const addMonths = (s, n) => {
    const d = parse(s), day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1, 12);
    t.setDate(Math.min(day, dim(t.getFullYear(), t.getMonth())));
    return iso(t);
  };
  const inR = (d, r) => d >= r.start && d < r.end;
  const round2 = n => Math.round(n * 100) / 100;

  const paycheck = st => st.income.find(i => i.freq === 'biweekly' || i.freq === 'weekly');
  const anchor = st => { const p = paycheck(st); return (p && p.date) || st.settings.anchor || '2026-11-19'; };

  function periodRange(st, view, offset, today) {
    if (view === 'monthly') {
      const t = parse(today);
      const s = new Date(t.getFullYear(), t.getMonth() + offset, 1, 12);
      const e = new Date(s.getFullYear(), s.getMonth() + 1, 1, 12);
      return { start: iso(s), end: iso(e), view };
    }
    const len = view === 'weekly' ? 7 : 14;
    const k = Math.floor(diffDays(anchor(st), today) / len) + offset;
    const start = addDays(anchor(st), k * len);
    return { start, end: addDays(start, len), view };
  }

  // Same day each month, clamped to month length (day 30 in Feb -> 28/29).
  function monthlyDates(day, r) {
    const out = [], s = parse(r.start), e = parse(addDays(r.end, -1));
    let y = s.getFullYear(), m = s.getMonth();
    while (y < e.getFullYear() || (y === e.getFullYear() && m <= e.getMonth())) {
      const d = iso(new Date(y, m, Math.min(day, dim(y, m)), 12));
      if (inR(d, r)) out.push(d);
      if (++m > 11) { m = 0; y++; }
    }
    return out;
  }
  function stepDates(base, step, r) {
    const out = [];
    let k = Math.ceil(diffDays(base, r.start) / step);
    for (let i = 0; i < 400; i++, k++) {
      const d = addDays(base, k * step);
      if (d >= r.end) break;
      if (d >= r.start) out.push(d);
    }
    return out;
  }

  // Pay plans (Klarna / Afterpay / PayPal)
  const planDate = (p, k) => p.dates && p.dates[p.paid + k - 1] ? p.dates[p.paid + k - 1]
    : p.freq === 'monthly' ? addMonths(p.lastDate, k)
    : addDays(p.lastDate, k * (p.freq === 'biweekly' ? 14 : 7));
  const planAmt = (p, n) => p.amounts && p.amounts[n - 1] != null ? p.amounts[n - 1] : p.amount;
  function planSchedule(st, p, today) {
    const out = [];
    for (let k = 1; k <= p.total - p.paid; k++) {
      const date = planDate(p, k), n = p.paid + k;
      const key = 'p:' + p.id + ':' + n;
      const auto = p.autopay !== false && date < today;
      out.push({ n, date, key, amount: planAmt(p, n), paid: key in st.marks ? !!st.marks[key] : auto, auto });
    }
    return out;
  }
  function planStatus(st, p, today) {
    const sched = planSchedule(st, p, today);
    const paidCount = p.paid + sched.filter(x => x.paid).length;
    const unpaid = sched.filter(x => !x.paid);
    return {
      purchased: p.purchased || planDate(p, 1 - p.paid), sched, paidCount, next: unpaid[0] || null, completed: paidCount >= p.total,
      left: p.total - paidCount, ends: sched.length ? sched[sched.length - 1].date : (p.dates ? p.dates[p.total - 1] : p.lastDate),
      owed: round2(unpaid.reduce((a, x) => a + x.amount, 0)),
      total: round2(Array.from({ length: p.total }, (_, i) => planAmt(p, i + 1)).reduce((a, b) => a + b, 0))
    };
  }

  // Postpone a plan payment. Every payment's date is written out in plan.dates (index = payment number - 1), so later moves are plain edits.
  // shift: this payment takes the new date and each later unpaid payment lands one interval after the one before it. Otherwise only this one moves.
  const planGap = (p, from, k) => p.freq === 'monthly' ? addMonths(from, k) : addDays(from, k * (p.freq === 'biweekly' ? 14 : 7));
  const planDates = p => Array.from({ length: p.total }, (_, i) => planDate(p, i + 1 - p.paid));
  // Why a payment cannot be moved ('' when it can): paid, linked to a bank line, or not part of the schedule.
  function postponeBlock(st, p, n, today) {
    const s = planSchedule(st, p, today).find(x => x.n === n);
    if (!s) return 'This payment is already done.';
    if (s.paid || (st.occ && st.occ[s.key] && st.occ[s.key].txn)) return 'This payment is already paid.';
    return '';
  }
  function postponeDates(st, p, n, to, shift, today) {
    const dates = planDates(p), from = dates[n - 1], sched = planSchedule(st, p, today);
    dates[n - 1] = to;
    if (shift) sched.filter(x => x.n > n && !x.paid).forEach(x => { dates[x.n - 1] = planGap(p, to, x.n - n); });
    return { dates, from };
  }
  function postponePlan(st, p, n, to, shift, today) {
    const why = postponeBlock(st, p, n, today);
    if (why) return { ok: false, error: why };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(to || '')) return { ok: false, error: 'Pick a date.' };
    const cur = planDates(p)[n - 1];
    if (to <= cur) return { ok: false, error: 'Pick a date after ' + cur + '.' };
    const r = postponeDates(st, p, n, to, shift, today);
    const rec = { n, from: r.from, to, at: today, shift: !!shift, prev: planDates(p), hadDates: !!p.dates };
    p.dates = r.dates;
    (p.postponed || (p.postponed = [])).push(rec);
    return { ok: true, rec };
  }
  // Puts the dates back as they were before the last postpone.
  function undoPostpone(p) {
    const rec = p.postponed && p.postponed.pop();
    if (!rec) return false;
    p.dates = rec.prev.slice();
    if (!p.postponed.length) { delete p.postponed; if (rec.hadDates === false) delete p.dates; }
    return true;
  }
  // Soft guidance, never blocking: what the provider usually allows against what was picked.
  function postponeWarnings(p, n, to) {
    const out = [], from = planDates(p)[n - 1], days = diffDays(from, to);
    if (days > 7) out.push('That is ' + days + ' days later. Providers usually allow up to 7 days.');
    if (p.provider === 'Afterpay' && (n === 1 || n === p.total)) out.push("Afterpay usually can't move the first or last payment in the app.");
    if (p.postponed && p.postponed.length) out.push('This plan was already postponed once. Providers usually allow it once per purchase.');
    return out;
  }

  const GROUPS = ['Fixed', 'Apple Subscriptions', 'Subscriptions', 'Other bills', 'Per paycheck', 'Pay plans', 'Credit cards', 'Spending'];

  // Per-paycheck items are budgets (envelopes): no due date, never paid by a tick. What counts toward one is the real
  // spending (state.spends) of its category inside its 14-day cycle. Each spend counts toward at most one budget
  // (the first one listed wins) and is flagged `budgeted`, so totals use max(budget, spent) once and never add the spend again.
  function applyBudgets(st, all, buds) {
    const order = id => st.perPeriod.findIndex(p => p.id === id);

function postponeLive() {

function logoNames() {

  const found = [], unk = {}; Object.values(state.bank.txns || {}).forEach(t => { if (!t || !t.date) return; const k = merchKey(t);
    if (k) { if (!seen.has(k)) { seen.add(k); found.push(svcRow(k)[6]); } } else { const n = cleanMerchant(t), u = svcKey(n); if (u) (unk[u] = unk[u] || { n, c: 0 }).c++; } });
  out.unshift(...found.sort(), ...Object.values(unk).filter(x => x.c >= 2).sort((p, q) => q.c - p.c).slice(0, 8).map(x => x.n).filter(n => { const k = svcKey(n); if (seen.has(k)) return false; seen.add(k); return true; }));
  const add = n => { n = String(n || '').trim(); const k = svcKey(n); if (n && k && !seen.has(k)) { seen.add(k); out.push(n); } };

  return out;
}

  const when = off.map(x => x.lastUpdated || (statusOf(x.itemId) || {}).lastSuccessfulUpdate).filter(Boolean).sort().pop();

  const parts = [];
  if (ok.length) parts.push('Balances updated from ' + ok.map(x => x.institution || 'a bank').join(', ') + '.');
  if (off.length) parts.push((ok.length ? off.map(x => x.institution || 'A bank').join(', ') + " hasn't" : "Your banks haven't") + ' sent new balances' + (when ? ' (Plaid last updated ' + plaidTime(when, false) + ')' : '') + '.' + (why ? ' ' + why : ''));

// Drag a bank by its grip (pointer events: mouse, pen and touch). Rows slide aside while dragging; the sheet scrolls near its edges.
const DRAG = { on: false, again: false };
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('.grip'); if (!g || DRAG.on || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const wrap = g.closest('.bal-bank'), host = wrap && wrap.parentElement, sc = $('#sheet .sheet'); if (!host || !sc) return;
  e.preventDefault();
  const items = [...host.children].filter(c => c.classList.contains('bal-bank')), n = items.length, i0 = items.indexOf(wrap);
  const top = el => el.getBoundingClientRect().top + sc.scrollTop, gap = parseFloat(getComputedStyle(wrap).marginBottom) || 0;
  const tops = items.map(top), hs = items.map(el => el.offsetHeight + gap), mids = items.map((el, k) => tops[k] + el.offsetHeight / 2);
  const d = { on: true, id: wrap.dataset.item, y0: e.clientY, s0: sc.scrollTop, y: e.clientY, t: i0, raf: 0 };
  Object.assign(DRAG, d, { again: false });
  try { g.setPointerCapture(e.pointerId); } catch (er) {}
  wrap.classList.add('dragging'); document.body.classList.add('dragging-bank');
  const layout = () => {
    const dy = DRAG.y - DRAG.y0 + sc.scrollTop - DRAG.s0, c = mids[i0] + dy;
    let t = 0; items.forEach((el, k) => { if (k !== i0 && mids[k] < c) t++; });
    DRAG.t = t; wrap.style.transform = `translateY(${dy}px)`;
    items.forEach((el, k) => { if (k === i0) return; el.style.transform = i0 < t && k > i0 && k <= t ? `translateY(${-hs[i0]}px)` : t < i0 && k >= t && k < i0 ? `translateY(${hs[i0]}px)` : ''; });
  };
  const tick = () => {
    if (!DRAG.on) return;
    const r = sc.getBoundingClientRect(), edge = 56, y = DRAG.y;
    const v = y < r.top + edge ? -Math.ceil((r.top + edge - y) / 5) : y > r.bottom - edge ? Math.ceil((y - (r.bottom - edge)) / 5) : 0;
    if (v) { const before = sc.scrollTop; sc.scrollTop += v; if (sc.scrollTop !== before) layout(); }

  };
  const move = ev => { if (ev.pointerId !== e.pointerId) return; DRAG.y = ev.clientY; layout(); };
  const end = ev => {
    if (ev.pointerId !== e.pointerId || !DRAG.on) return;

    cancelAnimationFrame(DRAG.raf);
    try { g.releasePointerCapture(e.pointerId); } catch (er) {}
    const t = ev.type === 'pointercancel' ? i0 : DRAG.t, ids = items.map(el => el.dataset.item);
    // Settle the dragged row into its slot, then save.
    let slot = 0; if (t > i0) for (let k = i0 + 1; k <= t; k++) slot += hs[k]; else for (let k = t; k < i0; k++) slot -= hs[k];
    wrap.classList.add('settle'); wrap.style.transform = `translateY(${slot}px)`;
    setTimeout(() => {
      DRAG.on = false; document.body.classList.remove('dragging-bank');
      if (t !== i0) { const o = ids.slice(); o.splice(i0, 1); o.splice(t, 0, ids[i0]); setBankOrder(o); }
      balanceSheet(); DRAG.again = false;
    }, 170);
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  DRAG.raf = requestAnimationFrame(tick); layout();
});

function saveAccount(f) {

  if (bankHas()) state.bank.useBankBalance = false; // a hand-entered balance wins over the live one
  const cur = BT.accountBalance(state, TODAY);
  if (cur === null || (f.elements.fresh && f.elements.fresh.checked)) {
    state.account = { balance: 0, asOf: TODAY, adj: [] };
    state.account.balance = BT.round2(v - BT.accountBalance(state, TODAY));
    closeSheet(); commit('Balance set'); return;
  }
  // Compare with what BudTracks expects (estimate or tracked balance). From now on it is a real balance.
  delete state.account.auto;
  const d = BT.round2(cur - v);
  if (d > 0) {
    let u = state.unalloc[0];
    if (u) { u.amount = BT.round2(u.amount + d); u.date = TODAY; }
    else { u = { id: uid('u'), date: TODAY, amount: d }; state.unalloc.push(u); }
    closeSheet(); commit(fmt(d) + ' added to unallocated');
    setTimeout(() => allocSheet(u.id), 250);
  } else if (d < 0) {
    (state.account.adj || (state.account.adj = [])).push({ date: TODAY, amount: -d });
    closeSheet(); commit('Balance updated');
  } else { closeSheet(); commit('Balance confirmed'); }
}

// Splits the account into what is left of this paycheck and what carried over from earlier ones.
function split(total) {
  const s = BT.summary(state, BT.periodRange(state, 'biweekly', 0, TODAY), TODAY);
  const cur = BT.round2(Math.min(total, s.income - s.paid));
  return { cur, prev: BT.round2(total - cur), date: s.inc[0] && s.inc[0].date };
}

// Plain breakdown of one unallocated item: short in total, explained by pay plans, already recorded, still unexplained.

function allocSheet(id) {

function addAllocRow() {
  if (!ALLOC) return;
  $('#alloc-rows').insertAdjacentHTML('beforeend', allocRow(ALLOC.n++, ALLOC.date));
  const r = $('#alloc-rows').lastElementChild;
  r.insertAdjacentHTML('afterbegin', `<button type="button" class="icon-btn row-x" data-action="alloc-del" aria-label="Remove this reason">${ICON.close}</button>`);

}
function readAlloc() {
  return [...document.querySelectorAll('.alloc-row')].map(r => ({
    category: r.querySelector('[name=cat]').value, amount: parseFloat(r.querySelector('[name=amt]').value),
    desc: r.querySelector('[name=desc]').value.trim(), date: r.querySelector('[name=date]').value, note: r.querySelector('[name=note]').value.trim()
  })).filter(x => x.amount > 0);

function allocLive() {
  const used = readAlloc().reduce((a, x) => a + x.amount, 0), rest = BT.round2(ALLOC.left - used);
  const el = $('#alloc-left'); el.textContent = fmt(rest); el.classList.toggle('over', rest < 0);

function saveAlloc(rest) {
  if (!ALLOC) return;
  const rows = readAlloc(), used = BT.round2(rows.reduce((a, x) => a + x.amount, 0));
  if (used > ALLOC.left + 0.004) { $('#ferr').textContent = 'That is ' + fmt(used - ALLOC.left) + ' more than what is left to sort out.'; return; }
  if (rows.some(x => !/^\d{4}-\d{2}-\d{2}$/.test(x.date))) { $('#ferr').textContent = 'Each spending needs a date.'; return; }
  if (!rows.length && !rest) { $('#ferr').textContent = 'Enter an amount, or put the rest in Other.'; return; }
  rows.forEach(x => state.spends.push({ id: uid('x'), from: ALLOC.id, category: x.category, desc: x.desc, amount: BT.round2(x.amount), date: x.date, note: x.note }));
  const remaining = BT.round2(ALLOC.left - used);
  if (rest && remaining > 0) {
    if (!state.categories.includes('Other')) state.categories.push('Other');
    state.spends.push({ id: uid('x'), from: ALLOC.id, category: 'Other', desc: 'Unrecorded spending', amount: remaining, date: ALLOC.date, note: '' });
  }

}

/* ---------- Sound ---------- */
let AC = null;
// Cash register "cha-ching": key clunk + drawer slam, then the bell and a coin rattle.
function chime() {
  if (state.settings.sound === false) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + 0.01, out = AC.createGain(); out.gain.value = 0.5; out.connect(AC.destination);
    const noise = (at, len, type, freq, q, vol) => {
      const n = AC.createBuffer(1, Math.ceil(AC.sampleRate * len), AC.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
      const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
      s.buffer = n; s.connect(f); f.connect(g); g.connect(out); s.start(at);
    };
    const tone = (at, f, len, vol, type) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(g); g.connect(out); o.start(at); o.stop(at + len + 0.05);
    };
    // "cha": lever clunk and drawer
    noise(t0, 0.06, 'bandpass', 1800, 1.2, 0.9);
    tone(t0, 95, 0.12, 0.5, 'triangle');
    noise(t0 + 0.07, 0.16, 'lowpass', 900, 0.7, 0.6);
    tone(t0 + 0.08, 70, 0.18, 0.35, 'triangle');
    // "ching": bright bell with inharmonic partials
    const b = t0 + 0.2;
    [[2637, 0.42, 1.3], [5274 * 1.003, 0.16, 0.8], [7120, 0.1, 0.5], [3956, 0.12, 0.9], [9890, 0.05, 0.3]].forEach(([f, v, l]) => tone(b, f, l, v));
    tone(b + 0.012, 2650, 1.1, 0.18);
    // coins
    for (let i = 0; i < 5; i++) tone(b + 0.05 + Math.random() * 0.25, 4200 + Math.random() * 3200, 0.07, 0.05 + Math.random() * 0.05);
  } catch (e) {}
}

  if (m < 1440) return Math.round(m / 60) + ' h ago';

}

}

}

/* ---------- Render ---------- */
function viewPlansTab() {
  const v = state.settings.plansView === 'cards' ? 'cards' : 'plans';
  return `<div class="stack"><div class="seg plans-seg" role="group" aria-label="Plans view"><button data-action="plans-view" data-v="plans" aria-pressed="${v === 'plans'}">Pay later</button><button data-action="plans-view" data-v="cards" aria-pressed="${v === 'cards'}">Credit cards</button></div>${v === 'cards' ? viewCards() : viewPlans()}</div>`;
}
/* ---------- Tab badges: new data since the tab was last opened ---------- */
const TABNAME = { overview: 'Overview', transactions: 'Transactions', bills: 'Bills', plans: 'Plans', income: 'Income' };
const newer = (at, since) => { const a = Date.parse(at), b = Date.parse(since); return !isNaN(a) && (isNaN(b) || a > b); };
function tabCounts() {
  const ts = (state.settings && state.settings.tabSeen) || {}, c = { transactions: 0, bills: 0, plans: 0, income: 0 };
  const b = state.bank || {};
  c.transactions = reviewCount(); // lines in the To review section
  // Matched by the app on its own after a sync (a decision made by hand is not "new data")
  Object.values(b.seen || {}).forEach(r => {
    if (!r || r.src !== 'sync' || r.auto === false) return;
    if (r.res === 'bill' && newer(r.at, ts.bills)) c.bills++;
    else if (r.res === 'match' && newer(r.at, ts.plans)) c.plans++;
    else if (r.res === 'income' && newer(r.at, ts.income)) c.income++;
  });
  // Likely completed: the bank line that suggests it arrived after the tab was last opened
  likelyMap().forEach(e => {
    const k = e.item && e.item.kind, tab = k === 'plan' ? 'plans' : k === 'bill' || k === 'card' ? 'bills' : '';
    if (tab && e.txn && newer(e.txn.at, ts[tab])) c[tab]++;
  });
  return c;
}
let lastAppBadge = null;
function paintBadges() {
  let c; try { c = tabCounts(); } catch (e) { c = { transactions: 0, bills: 0, plans: 0, income: 0 }; }
  document.querySelectorAll('.tabs a').forEach(a => {
    const k = a.getAttribute('href').slice(1), n = c[k] || 0, el = a.querySelector('.badge'); if (!el) return;
    el.hidden = !n; el.textContent = n ? (n > 99 ? '99+' : String(n)) : '';
    if (n) a.setAttribute('aria-label', TABNAME[k] + ', ' + n + (k === 'transactions' ? ' to review' : ' new')); else a.removeAttribute('aria-label');
  });

  if (lastAppBadge !== c.transactions) {
    lastAppBadge = c.transactions;
    try { const p = c.transactions > 0 ? navigator.setAppBadge && navigator.setAppBadge(c.transactions) : navigator.clearAppBadge && navigator.clearAppBadge(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
}
// Opening a tab clears its badge: last viewed = now. Saved straight away without another render.
function markTabSeen(tab) {
  const ts = state.settings.tabSeen || (state.settings.tabSeen = {});
  if (tab === 'overview' || !ts[tab]) { if (!ts[tab]) ts[tab] = new Date().toISOString(); return; }
  if (tab === 'transactions') return; // its badge is the number of lines to review, not new data
  if (!tabCounts()[tab]) return;
  ts[tab] = new Date().toISOString();
  // Only the timestamp is patched into the stored copy (a render must not rewrite everything else).
  try { const raw = JSON.parse(localStorage.getItem(LS)); if (raw && raw.settings) { raw.settings.tabSeen = Object.assign({}, raw.settings.tabSeen, ts); localStorage.setItem(LS, JSON.stringify(raw)); } } catch (e) {}
  clearTimeout(timer); timer = setTimeout(flush, 600);
}
const VIEWLBL = { weekly: 'Weekly', biweekly: 'Bi-weekly', monthly: 'Monthly' };
function closePeriod(focus) {
  const m = $('#periodMenu'), b = $('#periodBtn'); if (m.hidden) return;
  m.hidden = true; b.setAttribute('aria-expanded', 'false'); if (focus) b.focus();
}
function openPeriod() {
  const m = $('#periodMenu'); m.hidden = false; $('#periodBtn').setAttribute('aria-expanded', 'true');
  const it = m.querySelector('[aria-checked="true"]') || m.querySelector('button'); it.focus();
}
document.addEventListener('click', e => {
  if (e.target.closest('#periodBtn')) { $('#periodMenu').hidden ? openPeriod() : closePeriod(false); return; }
  if (!e.target.closest('#periodMenu')) closePeriod(false);
});
document.addEventListener('keydown', e => {
  const m = $('#periodMenu'), b = $('#periodBtn');
  if (e.key === 'Escape' && !m.hidden) { e.stopPropagation(); closePeriod(true); return; }
  if (e.target === b && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && m.hidden) { e.preventDefault(); openPeriod(); return; }
  if (!m.hidden && m.contains(e.target)) {
    const its = [...m.querySelectorAll('button')], i = its.indexOf(e.target);
    if (e.key === 'ArrowDown') { e.preventDefault(); its[(i + 1) % its.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); its[(i + its.length - 1) % its.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); its[0].focus(); }

}, true);
const TABS = { overview: viewOverview, transactions: viewTransactions, bills: viewBills, plans: viewPlansTab, income: viewIncome };
function currentTab() { const h = location.hash.slice(1); return h === 'cards' ? 'plans' : TABS[h] ? h : 'overview'; }
function render() {
  CATCOL = null;
  LIKELY = null;
  applyTheme();

  // The brand header stays mounted: only its dynamic bits change (Saved pill, hat).

  else if (bb.dataset.hat !== hk) { bb.dataset.hat = hk; const o = bb.querySelector('svg.hd'), t = document.createElement('div'); t.innerHTML = headSVG(hat()); o.replaceWith(t.firstElementChild); buildMarks(); }

}
let lastTab = null;
// Pull down from the very top of Transactions to refresh, like the sync button.
const PTR = { y0: null, d: 0, el: null };
function ptrEl() { if (!PTR.el) { PTR.el = document.createElement('div'); PTR.el.id = 'ptr'; PTR.el.setAttribute('aria-hidden', 'true'); PTR.el.innerHTML = `<span class="ptr-i">${ICON.refresh}</span>`; document.body.appendChild(PTR.el); } return PTR.el; }

window.addEventListener('touchstart', e => { PTR.y0 = (currentTab() === 'transactions' && scrollY <= 0 && $('#sheet').hidden && e.touches.length === 1) ? e.touches[0].clientY : null; PTR.d = 0; }, { passive: true });

  if (!go) return;
  const b = document.querySelector('.tx-card .card-h [data-action="bk-sync"]:not([disabled])');
  if (b) b.click(); else toast(bankReady() ? 'Already refreshing' : 'Connect a bank on the Income tab to refresh');

let SCROLLTO = '', SCROLLKEEP = null;
// Scrolls to a card on the Income tab. Content that loads late above it (the bank list, the AI card) would push it down,
// so for 2 s each redraw scrolls to it again, unless you scrolled yourself.
function scrollKeep(id) { const el = $('#' + id); if (!el) return; el.scrollIntoView({ block: 'start' }); SCROLLKEEP = { id, until: Date.now() + 2000, y: scrollY }; }
function scrollKept() { const k = SCROLLKEEP; if (!k) return; if (Date.now() > k.until || currentTab() !== 'income' || Math.abs(scrollY - k.y) > 2) { SCROLLKEEP = null; return; } scrollKeep(k.id); }
